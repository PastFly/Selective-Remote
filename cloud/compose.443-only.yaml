services:
  caddy:
    environment:
      CLOUD_PUBLIC_HOST: ${CLOUD_PUBLIC_HOST:?CLOUD_PUBLIC_HOST is required}
    ports: !override
      # TEST ONLY: only the isolated VM itself may reach this listener.
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile.443-only:/etc/caddy/Caddyfile:ro
