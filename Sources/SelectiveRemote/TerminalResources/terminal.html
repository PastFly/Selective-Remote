<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="xterm.css">
    <link rel="stylesheet" href="terminal-host.css">
    <title>Selective Remote Terminal</title>
</head>
<body>
    <main id="terminal-shell">
        <div id="terminal" aria-label="SSH-терминал"></div>
        <div
            id="terminal-suggestions"
            class="terminal-popover"
            role="listbox"
            aria-label="Подсказки команд"
            hidden
        ></div>
        <aside id="terminal-history" aria-label="История и подсказки команд" hidden>
            <header class="history-header">
                <div>
                    <h2 id="command-panel-title">История команд</h2>
                    <p id="command-panel-subtitle">Сохранена только на этом Mac</p>
                </div>
                <button id="history-close" class="icon-button" type="button" title="Закрыть">
                    ×
                </button>
            </header>
            <label class="history-search">
                <span aria-hidden="true">⌕</span>
                <input
                    id="history-query"
                    type="search"
                    placeholder="Поиск команд"
                    autocomplete="off"
                    spellcheck="false"
                >
            </label>
            <nav id="command-tabs" aria-label="Раздел подсказок">
                <button type="button" data-section="history" class="is-selected">
                    История
                </button>
                <button type="button" data-section="catalog">
                    Общие команды
                </button>
            </nav>
            <div id="history-options" class="history-options">
                <label>
                    <input id="history-enabled" type="checkbox" checked>
                    <span>Сохранять команды</span>
                </label>
                <button id="history-clear" type="button">Очистить</button>
            </div>
            <div id="history-list" role="list"></div>
            <div id="history-empty" hidden>
                <strong id="command-empty-title">История пока пуста</strong>
                <span id="command-empty-message">
                    Выполненные команды появятся здесь автоматически.
                </span>
            </div>
            <footer>
                Строки с пробелом в начале и признаками секретов не сохраняются.
            </footer>
        </aside>
    </main>
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="terminal-command-catalog.js"></script>
    <script src="terminal-host.js"></script>
</body>
</html>
