name: Verify Personal Vault history boundaries
on:
  push:
    branches: [codex/verify-personal-vault-history-boundary]
permissions:
  contents: read
jobs:
  history:
    name: Exact Personal Vault history and sync regression
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
        env:
          POSTGRES_DB: history_test
          POSTGRES_USER: srhistory
          POSTGRES_PASSWORD: ephemeral-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srhistory -d history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 328439cf126c2c176834b826c530c487d1ba6687
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "328439cf126c2c176834b826c530c487d1ba6687"
          test "$(git rev-parse HEAD^{tree})" = "9faf65b2ef50809062f459cc4ba1b784c4813d69"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Install Cloud dependencies
        working-directory: cloud
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the history and browser sync contract
        working-directory: cloud
        env:
          TEST_DATABASE_URL: postgresql://srhistory:ephemeral-integration-only@127.0.0.1:5432/history_test
        run: node --test tests/personal-vault-history.test.mjs tests/service.test.mjs tests/public-vault-sync.test.mjs
