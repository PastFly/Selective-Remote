name: Hotfix Test DMG

on:
  push:
    branches:
      - hotfix/sftp-string-object-provider-0.22.5

permissions:
  contents: read

jobs:
  build-test-dmg:
    name: Build Xcode 16.2 test DMG
    runs-on: macos-14
    timeout-minutes: 60

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Install build dependencies
        run: |
          brew install freerdp sdl3

      - name: Run tests
        run: |
          swift test

      - name: Build test DMG
        env:
          SELECTIVEREMOTE_UPDATE_FEED_URL: https://raw.githubusercontent.com/PastFly/Selective-Remote/main/Resources/updates.json
        run: |
          set -euo pipefail
          rm -rf dist
          ./scripts/build_app.sh
          ls -lh dist/

      - name: Upload test DMG
        uses: actions/upload-artifact@v4
        with:
          name: SelectiveRemote-sftp-hotfix-xcode16-2
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
