name: SFTP UI One-Shot Diff Cleanup

on:
  push:
    branches:
      - agent/sftp-ui-invalidation
    paths:
      - .github/workflows/sftp-ui-one-shot-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/sftp-ui-invalidation

      - name: Revert unintended icon-only diff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/SelectiveRemote/SFTPWorkspace.swift')
          text = path.read_text()
          old = ': isSymbolicLink ? "link" : "doc.fill"'
          new = ': isSymbolicLink ? "link" : "doc"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one accidental icon diff, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- Sources/SelectiveRemote/SFTPWorkspace.swift

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/SelectiveRemote/SFTPWorkspace.swift
          git diff --cached --quiet && exit 0
          git commit -m "Revert unintended SFTP file icon change"
          git push origin HEAD:agent/sftp-ui-invalidation
