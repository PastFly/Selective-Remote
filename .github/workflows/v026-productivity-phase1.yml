name: v0.26.0 Productivity Phase 1

on:
  push:
    branches:
      - feature/v0.26.0-smart-workspaces

permissions:
  contents: write

concurrency:
  group: v026-productivity-phase1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v026-phase1 applied]') }}
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.26.0-smart-workspaces
          fetch-depth: 0

      - name: Apply Host Insights and autocomplete patch
        run: python3 scripts/v026_phase1_patch.py

      - name: Swift tests
        run: swift test

      - name: Terminal browser tests
        run: node --test Tests/TerminalResourcesTests/*.test.js

      - name: Release build
        run: swift build -c release

      - name: Remove bootstrap driver
        run: git rm -- scripts/v026_phase1_patch.py .github/workflows/v026-productivity-phase1.yml

      - name: Commit validated phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Host Insights and context-aware terminal autocomplete [v026-phase1 applied]"
          git push origin HEAD:feature/v0.26.0-smart-workspaces
