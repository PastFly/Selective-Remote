name: Publish minimal 0.32 community prerelease

on:
  push:
    branches:
      - release/0.32.0-minimal-community
    paths:
      - .github/workflows/publish-minimal-community.yml

permissions:
  actions: read
  contents: write

jobs:
  community-prerelease:
    name: Publish pinned verified artifact only
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: PastFly/Selective-Remote
      SOURCE_SHA: 6ff7dfec4cb4c9ffc9472f192bd14069c833dbfc
      VERIFIED_RUN: "41616485070"
      PREVIEW_TAG: v0.32.0-community.1
      ARTIFACT: SelectiveRemote-0.32.0-minimal-community-arm64
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact source and successful workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$GITHUB_REF_NAME" = "release/0.32.0-minimal-community"
          test "$(git merge-base "$SOURCE_SHA" "$GITHUB_SHA")" = "$SOURCE_SHA"
          diff="$(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/community-candidate.yml|.github/workflows/publish-minimal-community.yml|releases/0.32.0-minimal-community.md) ;;
              *) echo "Unexpected source change since verified candidate: $file" >&2; exit 1 ;;
            esac
          done <<< "$diff"
          gh run watch "$VERIFIED_RUN" --repo "$REPO" --exit-status
          run_sha="$(gh api "repos/$REPO/actions/runs/$VERIFIED_RUN" --jq .head_sha)"
          conclusion="$(gh api "repos/$REPO/actions/runs/$VERIFIED_RUN" --jq .conclusion)"
          test "$run_sha" = "$SOURCE_SHA"
          test "$conclusion" = "success"
          if gh release view "$PREVIEW_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite." >&2
            exit 1
          fi
      - name: Download and verify exact DMG
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$VERIFIED_RUN" --repo "$REPO" --name "$ARTIFACT" --dir candidate
          dmg=candidate/SelectiveRemote-0.32.0-arm64.dmg
          test -s "$dmg"
          test -s "$dmg.sha256"
          (cd candidate && shasum -a 256 -c SelectiveRemote-0.32.0-arm64.dmg.sha256)
          hdiutil verify "$dmg"
      - name: Publish explicitly non-notarized prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$PREVIEW_TAG" \
            candidate/SelectiveRemote-0.32.0-arm64.dmg \
            candidate/SelectiveRemote-0.32.0-arm64.dmg.sha256 \
            --repo "$REPO" \
            --target "$SOURCE_SHA" \
            --title "Selective Remote 0.32.0 — minimal community preview (ad-hoc, not notarized)" \
            --notes-file releases/0.32.0-minimal-community.md \
            --prerelease \
            --latest=false
          gh release view "$PREVIEW_TAG" --repo "$REPO" --json tagName,isPrerelease,assets
