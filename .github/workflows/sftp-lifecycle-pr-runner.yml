name: SFTP lifecycle PR runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Extract and apply targeted patch
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/^[[:space:]]*python3 <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/sftp-lifecycle-hotfix.yml \
            | sed '1d;$d;s/^          //' > /tmp/sftp-lifecycle-patch.py
          python3 /tmp/sftp-lifecycle-patch.py
          python3 <<'PY'
          from pathlib import Path
          import re

          # Add the new concrete SFTP pane source to the Connection Center open action.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          pattern = re.compile(
              r"(    private func openConnectionCenterSource\(_ source: ConnectionCenterSource\) \{.*?"
              r"        case let \.sftp\(scope\):\n"
              r"            switch scope \{\n)"
              r"(            case let \.profile\(profileID\):)",
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("ContentView open SFTP scope marker not found")
          pane_case = '''            case let .pane(paneID):
              if let tab = model.sftpWorkspace.tab(containing: paneID) {
                  model.sftpWorkspace.selectedTabID = tab.id
              }
              setMainArea(.sftp)
          '''
          pane_case = "\n".join(line[10:] if line.startswith("          ") else line for line in pane_case.splitlines()) + "\n"
          text = text[:match.start(2)] + pane_case + text[match.start(2):]
          path.write_text(text)

          # Swift 6 on the CI runner diagnoses Process.run()'s throw in this
          # lightweight fixture oddly. Keep the regression behavioral, but make
          # fixture startup non-throwing and assert that it actually launched.
          path = Path("Tests/SelectiveRemoteTests/SFTPLifecycleRegressionTests.swift")
          text = path.read_text()
          text = text.replace(
              "func sftpCancelEscalatesToSIGKILL() async throws {",
              "func sftpCancelEscalatesToSIGKILL() async {",
              1,
          )
          text = text.replace(
              "    try process.run()",
              "    try? process.run()\n    #expect(process.isRunning)\n    guard process.isRunning else { return }",
              1,
          )
          text = text.replace("    try await Task.sleep", "    try? await Task.sleep")
          path.write_text(text)
          PY

      - name: Run Swift tests
        run: swift test

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sftp-lifecycle-hotfix.yml
          rm .github/workflows/sftp-lifecycle-pr-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests .github/workflows/sftp-lifecycle-hotfix.yml .github/workflows/sftp-lifecycle-pr-runner.yml
          git commit -m "Fix SFTP workspace lifecycle [sftp-lifecycle-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
