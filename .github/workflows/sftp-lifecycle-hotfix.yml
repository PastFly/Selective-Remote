name: SFTP regression patch carrier
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          content_path = Path("Sources/SelectiveRemote/ContentView.swift")
          content = content_path.read_text()

          pane_pattern = re.compile(
              r"\n[ \t]*case let \.pane\(paneID\):\n"
              r"[ \t]*if let tab = model\.sftpWorkspace\.tab\(containing: paneID\) \{\n"
              r"[ \t]*model\.sftpWorkspace\.selectedTabID = tab\.id\n"
              r"[ \t]*\}\n"
              r"[ \t]*setMainArea\(\.sftp\)\n",
              re.M,
          )
          content, removed = pane_pattern.subn("\n", content, count=1)
          if removed != 1:
              raise SystemExit(f"expected one Connection Center pane case, removed={removed}")

          workspace_pattern = re.compile(
              r"    private var sshRuntimeWorkspace: some View \{.*?\n    \}\n\n    @ViewBuilder\n    private var sshRuntimeContent: some View \{",
              re.S,
          )
          match = workspace_pattern.search(content)
          if not match:
              raise SystemExit("sshRuntimeWorkspace block not found")
          replacement = "\n".join([
              "    private var sshRuntimeWorkspace: some View {",
              "        VStack(spacing: 0) {",
              "            if !terminalFocusMode {",
              "                sshCompactWorkspaceHeader",
              "            } else if selectedTab != .terminal {",
              "                focusExitBar",
              "            }",
              "",
              "            sshRuntimeContent",
              "                .padding(.horizontal, terminalFocusMode ? 10 : 18)",
              "                .padding(.top, terminalFocusMode ? 4 : 0)",
              "                .padding(.bottom, terminalFocusMode ? 10 : 16)",
              "                .frame(maxWidth: .infinity, maxHeight: .infinity)",
              "        }",
              "    }",
              "",
              "    private var focusExitBar: some View {",
              "        HStack {",
              "            Spacer()",
              "            Button {",
              "                setTerminalFocusMode(false)",
              "            } label: {",
              "                Label(",
              "                    UpdateLocalization.text(ru: \"Выйти из фокуса\", en: \"Exit Focus\"),",
              "                    systemImage: \"arrow.down.right.and.arrow.up.left\"",
              "                )",
              "            }",
              "            .buttonStyle(.borderedProminent)",
              "        }",
              "        .padding(.horizontal, 10)",
              "        .padding(.top, 8)",
              "        .padding(.bottom, 2)",
              "    }",
              "",
              "    @ViewBuilder",
              "    private var sshRuntimeContent: some View {",
          ])
          content = content[:match.start()] + replacement + content[match.end():]
          content_path.write_text(content)

          sftp_path = Path("Sources/SelectiveRemote/SFTPWorkspace.swift")
          sftp = sftp_path.read_text()

          monitor_pattern = re.compile(
              r"(?P<indent>^[ \t]*)SFTPWorkspaceAppKitDragMonitor\(\s*"
              r"token: sftpWorkspaceInternalDragToken\(\s*"
              r"paneID: paneID,\s*entryID: entry\.id\s*\),\s*"
              r"isDirectory: entry\.isDirectory\s*\)\s*\{\s*"
              r"if !remote\.selectedEntryIDs\.contains\(entry\.id\) \{\s*"
              r"remote\.selectedEntryIDs = \[entry\.id\]\s*"
              r"selectionAnchor = entry\.id\s*\}\s*\}\s*"
              r"\.allowsHitTesting\(false\)",
              re.M | re.S,
          )
          monitor_match = monitor_pattern.search(sftp)
          if not monitor_match:
              raise SystemExit("remote AppKit drag monitor structure not found")
          indent = monitor_match.group("indent")
          monitor_replacement = "\n".join([
              indent + "SFTPWorkspaceAppKitDragMonitor(",
              indent + "    token: sftpWorkspaceInternalDragToken(",
              indent + "        paneID: paneID,",
              indent + "        entryID: entry.id",
              indent + "    ),",
              indent + "    isDirectory: entry.isDirectory",
              indent + ")",
              indent + ".allowsHitTesting(false)",
          ])
          sftp = sftp[:monitor_match.start()] + monitor_replacement + sftp[monitor_match.end():]

          line_patterns = [
              r"^[ \t]*let prepareDrag: \(\) -> Void\n",
              r"^[ \t]*view\.prepareDrag = prepareDrag\n",
              r"^[ \t]*nsView\.prepareDrag = prepareDrag\n",
              r"^[ \t]*var prepareDrag: \(\(\) -> Void\)\?\n",
              r"^[ \t]*prepareDrag\?\(\)\n",
          ]
          for pattern in line_patterns:
              sftp, count = re.subn(pattern, "", sftp, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"drag monitor marker missing: {pattern}, count={count}")
          sftp_path.write_text(sftp)

          test_path = Path("Tests/SelectiveRemoteTests/SFTPWorkspaceSmartLinksTests.swift")
          tests = test_path.read_text()
          marker = '@Test("SFTP focus mode keeps its exit control outside the workspace toolbar")'
          if marker not in tests:
              tests += "\n" + "\n".join([
                  '@Test("SFTP focus mode keeps its exit control outside the workspace toolbar")',
                  'func sftpFocusExitDoesNotOverlayWorkspaceToolbar() throws {',
                  '    let projectRoot = URL(fileURLWithPath: #filePath)',
                  '        .deletingLastPathComponent()',
                  '        .deletingLastPathComponent()',
                  '        .deletingLastPathComponent()',
                  '    let source = try String(',
                  '        contentsOf: projectRoot',
                  '            .appendingPathComponent("Sources/SelectiveRemote/ContentView.swift"),',
                  '        encoding: .utf8',
                  '    )',
                  '',
                  '    #expect(source.contains("else if selectedTab != .terminal {\\n                focusExitBar"))',
                  '    #expect(source.contains("private var focusExitBar: some View"))',
                  '    #expect(!source.contains(".overlay(alignment: .topTrailing) {\\n            if terminalFocusMode && selectedTab != .terminal"))',
                  '}',
                  '',
                  '@Test("SFTP remote drag does not mutate selection on mouse down")',
                  'func sftpRemoteDragDoesNotInvalidateItsMonitorOnMouseDown() throws {',
                  '    let projectRoot = URL(fileURLWithPath: #filePath)',
                  '        .deletingLastPathComponent()',
                  '        .deletingLastPathComponent()',
                  '        .deletingLastPathComponent()',
                  '    let source = try String(',
                  '        contentsOf: projectRoot',
                  '            .appendingPathComponent("Sources/SelectiveRemote/SFTPWorkspace.swift"),',
                  '        encoding: .utf8',
                  '    )',
                  '',
                  '    #expect(source.contains("SFTPWorkspaceAppKitDragMonitor("))',
                  '    #expect(source.contains("beginSFTPDraggingSession(event: event, point: point)"))',
                  '    #expect(!source.contains("let prepareDrag: () -> Void"))',
                  '    #expect(!source.contains("var prepareDrag: (() -> Void)?"))',
                  '    #expect(!source.contains("prepareDrag?()"))',
                  '}',
                  '',
              ])
          test_path.write_text(tests)

          terminal_test_path = Path("Tests/SelectiveRemoteTests/TerminalTests.swift")
          terminal_tests = terminal_test_path.read_text()
          old_focus_contract = '    #expect(content.contains("terminalFocusMode && selectedTab != .terminal"))'
          new_focus_contract = "\n".join([
              '    #expect(content.contains("else if selectedTab != .terminal"))',
              '    #expect(content.contains("private var focusExitBar: some View"))',
              '    #expect(!content.contains(".overlay(alignment: .topTrailing)"))',
          ])
          if old_focus_contract not in terminal_tests:
              raise SystemExit("stale Terminal focus-mode assertion not found")
          terminal_tests = terminal_tests.replace(old_focus_contract, new_focus_contract, 1)
          terminal_test_path.write_text(terminal_tests)

          hook = Path(".git/hooks/pre-commit")
          hook.write_text('''#!/bin/bash
set -euo pipefail
python3 <<'HOOKPY'
from pathlib import Path
import re
p = Path("Sources/SelectiveRemote/ContentView.swift")
s = p.read_text()
pattern = re.compile(
    r"\n[ \t]*case let \.pane\(paneID\):\n"
    r"[ \t]*if let tab = model\.sftpWorkspace\.tab\(containing: paneID\) \{\n"
    r"[ \t]*model\.sftpWorkspace\.selectedTabID = tab\.id\n"
    r"[ \t]*\}\n"
    r"[ \t]*setMainArea\(\.sftp\)\n",
    re.M,
)
good = "\n" + "\n".join([
    "            case let .pane(paneID):",
    "                if let tab = model.sftpWorkspace.tab(containing: paneID) {",
    "                    model.sftpWorkspace.selectedTabID = tab.id",
    "                }",
    "                setMainArea(.sftp)",
]) + "\n"
s, count = pattern.subn(good, s, count=1)
if count != 1:
    raise SystemExit(f"pane case normalization failed: count={count}")
p.write_text(s)
HOOKPY
git add Sources Tests
git diff --cached --check
echo "==> Validating SFTP focus/DnD release build"
swift build -c release
echo "==> Validating SFTP focus/DnD full test suite"
swift test
''')
          hook.chmod(0o755)
          PY
