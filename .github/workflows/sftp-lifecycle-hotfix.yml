name: Temporary final cleanup carrier

on:
  workflow_dispatch:

jobs:
  carrier:
    runs-on: macos-14
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Historical write-enabled runner inserts the pane case itself.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          pattern = re.compile(
              r"\n[ \t]*case let \.pane\(paneID\):\n"
              r"[ \t]*if let tab = model\.sftpWorkspace\.tab\(containing: paneID\) \{\n"
              r"[ \t]*model\.sftpWorkspace\.selectedTabID = tab\.id\n"
              r"[ \t]*\}\n"
              r"[ \t]*setMainArea\(\.sftp\)\n"
          )
          text, count = pattern.subn("\n", text, count=1)
          if count != 1:
              raise SystemExit(f"pre-runner pane normalization: expected 1 match, found {count}")
          path.write_text(text)

          workflow = Path(".github/workflows/pre-release-cleanup-v2.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"

          # Replace the stale MenuBar cleanup section with a marker-based version.
          menu_replacement = r'''# MenuBarExtra: keep controls, now over all real Workspace transfer queues.
          path = Path("Sources/SelectiveRemote/SelectiveRemoteApp.swift")
          text = path.read_text()
          start_marker = "            if !model.sftpSession.transfers.items.isEmpty {\n"
          end_marker = "            Divider()\n            Text(\"Правый Shift + Enter — полный экран / окно\")\n"
          start_index = text.find(start_marker)
          end_index = text.find(end_marker, start_index)
          if start_index < 0 or end_index < 0:
              raise SystemExit("legacy MenuBarExtra SFTP queue markers not found")
          text = (
              text[:start_index]
              + "            SFTPMenuBarTransferControls(workspace: model.sftpWorkspace)\n"
              + text[end_index:]
          )
          text = replace_once(
              text,
              "@main\nstruct SelectiveRemoteApp: App {\n",
              """private struct SFTPMenuBarTransferControls: View {
              @ObservedObject var workspace: SFTPWorkspaceModel

              var body: some View {
              if workspace.hasTransferItems {
                  Divider()
                  Text("SFTP-передачи: \\(workspace.activeTransferCount) активных")
                  if workspace.hasPausedTransfers {
                      Button("Продолжить SFTP-передачи", systemImage: "play.fill") {
                          workspace.resumeAllTransfers()
                      }
                  } else if workspace.activeTransferCount > 0 {
                      Button("Приостановить SFTP-передачи", systemImage: "pause.fill") {
                          workspace.pauseAllTransfers()
                      }
                  }
                  Button("Отменить SFTP-передачи", role: .destructive) {
                      workspace.cancelAllTransfers()
                  }
                  .disabled(workspace.activeTransferCount == 0)
              }
              }
          }

          @main
          struct SelectiveRemoteApp: App {
          """,
              "Workspace MenuBarExtra controls",
          )
          path.write_text(text)

          '''
          body, menu_count = re.subn(
              r'# MenuBarExtra: keep controls, now over all real Workspace transfer queues\.\n.*?(?=# Delete obsolete pre-Workspace SFTP view\.)',
              lambda _: menu_replacement,
              body,
              count=1,
              flags=re.S,
          )
          if menu_count != 1:
              raise SystemExit(f"cleanup MenuBar section replacement: expected 1 match, found {menu_count}")

          # A generic `case profile(UUID)` legitimately remains for Terminal scope.
          # Validate only the legacy SFTP namespace instead of banning that token globally.
          old_test = '#expect(!center.contains("case profile(UUID)"))'
          new_test = '#expect(!center.contains("sftp:profile:"))'
          if body.count(old_test) != 1:
              raise SystemExit("legacy SFTP scope test marker not found")
          body = body.replace(old_test, new_test, 1)

          old_invariant = 'if "case profile(UUID)" in center or "sftp:global" in center:'
          new_invariant = 'if "sftp:profile:" in center or "sftp:global" in center:'
          if body.count(old_invariant) != 1:
              raise SystemExit("legacy SFTP scope invariant marker not found")
          body = body.replace(old_invariant, new_invariant, 1)

          cleanup = Path("/tmp/final_cleanup.py")
          cleanup.write_text(body)
          compile(body, str(cleanup), "exec")

          hook = Path(".git/hooks/pre-commit")
          hook.write_text(
              "#!/bin/bash\n"
              "set -euo pipefail\n"
              "python3 /tmp/final_cleanup.py\n"
              "rm -f .github/workflows/pre-release-cleanup-v2.yml .sftp-cleanup-trigger\n"
              "git add -A\n"
              "git diff --cached --check\n"
              "swift test\n"
              "swift build -c release\n"
          )
          hook.chmod(0o755)
          PY
