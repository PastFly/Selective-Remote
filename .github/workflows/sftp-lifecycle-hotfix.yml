name: SFTP lifecycle test fix carrier
on:
  workflow_dispatch:
jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Tests/SelectiveRemoteTests/TerminalTests.swift")
          text = path.read_text()
          old = 'SFTPWorkspaceView(workspace: globalSFTPWorkspace)'
          new = 'SFTPWorkspaceView(workspace: model.sftpWorkspace)'
          if text.count(old) != 1:
              raise SystemExit(f"TerminalTests marker mismatch: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          path = Path("Tests/SelectiveRemoteTests/ConnectionCenterTests.swift")
          text = path.read_text()
          old = '    #expect(appModel.contains("session: sftpSession"))\n    #expect(appModel.contains("session: globalSFTPSession"))'
          new = '    #expect(appModel.contains("for tab in sftpWorkspace.tabs"))\n    #expect(appModel.contains("appendConnectionCenterSFTP(pane: tab.left"))'
          if text.count(old) != 1:
              raise SystemExit(f"ConnectionCenterTests marker mismatch: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          # The stored runner always inserts this case itself. Remove the exact
          # already-committed copy first; its indentation is intentionally
          # irrelevant to Swift and came from the old carrier's whitespace trim.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          pane = "  case let .pane(paneID):\n    if let tab = model.sftpWorkspace.tab(containing: paneID) {\n        model.sftpWorkspace.selectedTabID = tab.id\n    }\n    setMainArea(.sftp)\n"
          if text.count(pane) != 1:
              raise SystemExit(f"ContentView pane marker mismatch: {text.count(pane)}")
          path.write_text(text.replace(pane, "", 1))
          PY
