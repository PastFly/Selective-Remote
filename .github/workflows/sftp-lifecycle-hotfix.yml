name: SFTP unified drop patch carrier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Sources/SelectiveRemote/SFTPWorkspace.swift")
          text = path.read_text()

          # Work on the two pane sections independently so we do not depend on
          # exact whitespace inside SwiftUI modifier closures.
          local_start = text.index("private struct SFTPWorkspaceLocalPaneView: View")
          remote_start = text.index("private struct SFTPWorkspaceRemotePaneView: View")
          local = text[local_start:remote_start]
          remote = text[remote_start:]

          # Remove the nested row drop destinations completely. Nested List row
          # destinations were competing with the pane destination on macOS.
          row_start = local.index("                    .dropDestination(for: String.self)")
          row_end_marker = "\n                }\n            }\n            .listStyle"
          row_end = local.index(row_end_marker, row_start)
          local = local[:row_start] + local[row_end:]

          row_start = remote.index("                        .dropDestination(for: String.self)")
          row_end_marker = "\n                    }\n                }\n                .listStyle"
          row_end = remote.index(row_end_marker, row_start)
          remote = remote[:row_start] + remote[row_end:]

          # Replace the two competing pane-level destinations with one onDrop
          # that registers all supported payload types and owns isTargeted.
          pane_start = local.index("            .dropDestination(for: String.self)")
          pane_end_marker = "\n            .overlay {\n                sftpWorkspaceDropOverlay"
          pane_end = local.index(pane_end_marker, pane_start)
          local_drop = '''            .onDrop(
                of: sftpWorkspaceDropTypeIdentifiers,
                isTargeted: $dropTargeted
            ) { providers in
                acceptDrops(providers, destination: model.currentDirectory)
            }
'''
          local = local[:pane_start] + local_drop + local[pane_end:]

          pane_start = remote.index("                .dropDestination(for: String.self)")
          pane_end_marker = "\n                .overlay {\n                    sftpWorkspaceDropOverlay"
          pane_end = remote.index(pane_end_marker, pane_start)
          remote_drop = '''                .onDrop(
                    of: sftpWorkspaceDropTypeIdentifiers,
                    isTargeted: $dropTargeted
                ) { providers in
                    acceptDrops(
                        providers,
                        to: remote.currentPath,
                        destinationSettings: settings
                    )
                }
'''
          remote = remote[:pane_start] + remote_drop + remote[pane_end:]

          # Local pane: first retain the legacy custom payload path, then accept
          # the AppKit public.utf8-plain-text token used by remote rows, then
          # process normal local file URLs.
          local_accept = local.index(
              "    private func acceptDrops(\n"
              "        _ providers: [NSItemProvider],\n"
              "        destination: URL\n"
              "    ) -> Bool {"
          )
          file_marker = "        let fileProviders = providers.filter {\n"
          file_pos = local.index(file_marker, local_accept)
          string_branch = '''        let stringProviders = providers.filter {
            $0.hasItemConformingToTypeIdentifier(
                NSPasteboard.PasteboardType.string.rawValue
            )
        }
        if !stringProviders.isEmpty {
            for provider in stringProviders {
                provider.loadDataRepresentation(
                    forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue
                ) { data, _ in
                    guard let data,
                          let value = String(data: data, encoding: .utf8)
                    else { return }
                    Task { @MainActor in
                        _ = acceptInternalRemoteDrag(
                            [value],
                            destination: destination
                        )
                    }
                }
            }
            return true
        }

'''
          local = local[:file_pos] + string_branch + local[file_pos:]

          # Remote pane: fileURL is Mac -> Server. If no fileURL is present,
          # decode the AppKit string token and reuse the existing Server -> Server
          # transfer implementation.
          remote_accept = remote.index(
              "    private func acceptDrops(\n"
              "        _ providers: [NSItemProvider],\n"
              "        to destinationDirectory: String,"
          )
          file_pos = remote.index(file_marker, remote_accept)
          function_end_marker = "\n    }\n\n}\n\n@MainActor\nprivate struct SFTPWorkspaceAppKitDragMonitor"
          function_end = remote.index(function_end_marker, file_pos)
          remote_handler = '''        let fileProviders = providers.filter {
            $0.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier)
        }
        if !fileProviders.isEmpty {
            for provider in fileProviders {
                provider.loadObject(ofClass: NSURL.self) { object, _ in
                    guard let nsURL = object as? NSURL else { return }
                    let url = nsURL as URL
                    Task { @MainActor in
                        remote.upload(
                            localURLs: [url],
                            to: destinationDirectory,
                            settings: destinationSettings
                        )
                    }
                }
            }
            return true
        }

        let stringProviders = providers.filter {
            $0.hasItemConformingToTypeIdentifier(
                NSPasteboard.PasteboardType.string.rawValue
            )
        }
        guard !stringProviders.isEmpty else { return false }
        for provider in stringProviders {
            provider.loadDataRepresentation(
                forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue
            ) { data, _ in
                guard let data,
                      let value = String(data: data, encoding: .utf8)
                else { return }
                Task { @MainActor in
                    _ = acceptInternalRemoteDrag(
                        [value],
                        to: destinationDirectory,
                        destinationSettings: destinationSettings
                    )
                }
            }
        }
        return true
'''
          remote = remote[:file_pos] + remote_handler + remote[function_end:]

          text = text[:local_start] + local + remote

          # One shared registration list for both pane destinations.
          marker = 'private let sftpWorkspaceInternalDragPrefix = "SelectiveRemoteSFTPRemote|"\n'
          drop_types = '''private let sftpWorkspaceDropTypeIdentifiers = [
    UTType.fileURL.identifier,
    NSPasteboard.PasteboardType.string.rawValue,
    SFTPDragType.remoteEntry.identifier
]

'''
          if drop_types not in text:
              if marker not in text:
                  raise SystemExit("internal drag prefix marker not found")
              text = text.replace(marker, drop_types + marker, 1)

          # Structural assertions: after this patch there must be no typed
          # dropDestination left and exactly two unified pane destinations.
          if ".dropDestination(for: String.self)" in text:
              raise SystemExit("typed dropDestination still present")
          if text.count("of: sftpWorkspaceDropTypeIdentifiers") != 2:
              raise SystemExit("expected exactly two unified pane destinations")
          if text.count("isTargeted: $dropTargeted") != 2:
              raise SystemExit("expected exactly two targeted pane destinations")
          path.write_text(text)

          tests = Path("Tests/SelectiveRemoteTests/SFTPWorkspaceSmartLinksTests.swift")
          test_text = tests.read_text()
          old_expect = '#expect(source.contains(".dropDestination(for: String.self)"))'
          count = test_text.count(old_expect)
          if count != 2:
              raise SystemExit(f"expected two old dropDestination expectations, found {count}")
          test_text = test_text.replace(
              old_expect,
              '#expect(source.contains("sftpWorkspaceDropTypeIdentifiers"))',
          )

          marker = '@Test("SFTP uses one unified pane drop destination")'
          if marker not in test_text:
              test_text += '''

@Test("SFTP uses one unified pane drop destination")
func sftpWorkspaceUsesUnifiedPaneDropDestination() throws {
    let projectRoot = URL(fileURLWithPath: #filePath)
        .deletingLastPathComponent()
        .deletingLastPathComponent()
        .deletingLastPathComponent()
    let source = try String(
        contentsOf: projectRoot
            .appendingPathComponent("Sources/SelectiveRemote/SFTPWorkspace.swift"),
        encoding: .utf8
    )

    #expect(!source.contains(".dropDestination(for: String.self)"))
    #expect(source.contains("NSPasteboard.PasteboardType.string.rawValue"))
    #expect(source.components(separatedBy: "of: sftpWorkspaceDropTypeIdentifiers").count - 1 == 2)
    #expect(source.components(separatedBy: "isTargeted: $dropTargeted").count - 1 == 2)
}
'''
          tests.write_text(test_text)

          # The historical reusable runner inserts this case exactly once.
          content = Path("Sources/SelectiveRemote/ContentView.swift")
          c = content.read_text()
          pane_block = '''  case let .pane(paneID):
    if let tab = model.sftpWorkspace.tab(containing: paneID) {
        model.sftpWorkspace.selectedTabID = tab.id
    }
    setMainArea(.sftp)
'''
          if pane_block not in c:
              raise SystemExit("existing pane case block not found")
          c = c.replace(pane_block, "", 1)
          content.write_text(c)
          PY