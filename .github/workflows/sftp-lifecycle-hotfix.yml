name: SFTP final-format carrier

on:
  workflow_dispatch:

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          # Let the saved runner re-add its pane case, then the pre-commit hook
          # will normalize the final post-patch source and validate it.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          pattern = re.compile(
              r"(        case let \.sftp\(scope\):\n"
              r"            switch scope \{\n)"
              r"[ \t]*case let \.pane\(paneID\):\n"
              r"[ \t]*if let tab = model\.sftpWorkspace\.tab\(containing: paneID\) \{\n"
              r"[ \t]*model\.sftpWorkspace\.selectedTabID = tab\.id\n"
              r"[ \t]*\}\n"
              r"[ \t]*setMainArea\(\.sftp\)\n"
              r"(?=            case let \.profile\(profileID\):)",
          )
          text, count = pattern.subn(r"\1", text, count=1)
          if count != 1:
              raise SystemExit(f"ContentView transport marker mismatch: {count}")
          path.write_text(text)

          formatter_b64 = ""
          hook_b64 = "IyEvYmluL2Jhc2gKc2V0IC1ldW8gcGlwZWZhaWwKcHl0aG9uMyAuZ2l0L2hvb2tzL3NmdHAtZmluYWwtZm9ybWF0LnB5Cg=="
          hooks = Path(".git/hooks")
          hooks.mkdir(parents=True, exist_ok=True)
          formatter = hooks / "sftp-final-format.py"
          formatter.write_bytes(base64.b64decode(formatter_b64))
          hook = hooks / "pre-commit"
          hook.write_bytes(base64.b64decode(hook_b64))
          hook.chmod(0o755)
          PY
