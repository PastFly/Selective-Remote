name: Temporary pre-release cleanup carrier

on:
  workflow_dispatch:

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import stat

          def lines(*items):
              return "\n".join(items) + "\n"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return updated

          # Remove the superseded AppModel SFTP sessions and observer fan-out.
          path = Path("Sources/SelectiveRemote/AppModel.swift")
          text = path.read_text()
          text = replace_once(
              text,
              lines(
                  "    let sftpSession = SFTPBrowserSession()",
                  "    let globalSFTPSession = SFTPBrowserSession()",
              ),
              "",
              "legacy AppModel SFTP sessions",
          )
          text = replace_once(
              text,
              "    private var sftpObservers: [AnyCancellable] = []\n",
              "",
              "legacy SFTP observer property",
          )
          text = sub_once(
              text,
              r"\n        sftpObservers = \[\n.*?\n        \]\n        refreshDisplays\(configureEmptyProfile: true\)",
              "\n        refreshDisplays(configureEmptyProfile: true)",
              "legacy SFTP observer wiring",
              re.S,
          )
          # Keep legacy enum cases temporarily exhaustive, but make them inert.
          text = replace_once(
              text,
              lines(
                  "        case let .sftp(scope):",
                  "            switch scope {",
                  "            case let .pane(paneID):",
                  "                sftpWorkspace.pane(id: paneID)?.clear()",
                  "            case let .profile(profileID):",
                  "                if sftpSession.profileID == profileID {",
                  "                    sftpSession.disconnect()",
                  "                }",
                  "            case .global:",
                  "                globalSFTPSession.disconnect()",
                  "            }",
              ),
              lines(
                  "        case let .sftp(scope):",
                  "            switch scope {",
                  "            case let .pane(paneID):",
                  "                sftpWorkspace.pane(id: paneID)?.clear()",
                  "            case .profile, .global:",
                  "                break",
                  "            }",
              ),
              "temporary SFTP disconnect compatibility",
          )
          path.write_text(text)

          # Remove the unreachable global-SFTP editor/runtime.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"    private static let globalSFTPScopeID = UUID\(\n        uuidString: \"9C99721B-CFF3-48B7-A0A4-22E627A7D56C\"\n    \)!\n\n",
              "",
              "global SFTP scope ID",
          )
          text = replace_once(
              text,
              lines(
                  "    @State private var showsGlobalSFTPConnectionEditor = false",
                  "    @State private var globalSFTPConnection: TerminalTabConnection?",
              ),
              "",
              "global SFTP editor state",
          )
          text = sub_once(
              text,
              r"\n        \.sheet\(isPresented: \$showsGlobalSFTPConnectionEditor\) \{.*?\n        \}\n        \.onAppear \{",
              "\n        .onAppear {",
              "global SFTP editor sheet",
              re.S,
          )
          text = sub_once(
              text,
              r"\n    private var globalSFTPProfile: ConnectionProfile \{.*?\n    @ViewBuilder\n    private var selectedSettingsContent: some View \{",
              "\n    @ViewBuilder\n    private var selectedSettingsContent: some View {",
              "global SFTP helper block",
              re.S,
          )
          # Historical runner needs profile to be the first case so it can insert pane.
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n            switch scope \{\n.*?\n            \}\n        case let \.profileTunnel",
              lines(
                  "        case let .sftp(scope):",
                  "            switch scope {",
                  "            case let .profile(profileID):",
                  "                model.selectProfile(profileID)",
                  "                selectedTab = .sftp",
                  "                setMainArea(.connections)",
                  "            case .global:",
                  "                setMainArea(.sftp)",
                  "            }",
                  "        case let .profileTunnel",
              ).rstrip("\n"),
              "temporary Connection Center SFTP routing",
              re.S,
          )
          path.write_text(text)

          # Delete obsolete application-menu controls bound to the old single SFTP session.
          path = Path("Sources/SelectiveRemote/SelectiveRemoteApp.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"\n            if !model\.sftpSession\.transfers\.items\.isEmpty \{.*?\n            \}\n            Divider\(\)",
              "\n            Divider()",
              "legacy app-menu SFTP transfer controls",
              re.S,
          )
          path.write_text(text)

          # Release workflow must never suggest an obsolete hard-coded tag.
          path = Path(".github/workflows/release.yml")
          text = path.read_text()
          text = replace_once(text, "        default: v0.20.6\n", "", "stale release default")
          path.write_text(text)

          # Pre-commit runs after the historical runner's compatibility insertion.
          hook = Path(".git/hooks/pre-commit")
          hook.write_text(r"""#!/bin/bash
          set -euo pipefail
          python3 <<'HOOKPY'
          from pathlib import Path
          import re

          def lines(*items):
              return "\n".join(items) + "\n"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return updated

          # Final Connection Center SFTP source is only a live Workspace pane.
          path = Path("Sources/SelectiveRemote/ConnectionCenter.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"enum ConnectionCenterSFTPScope: Hashable \{\n.*?\n\}",
              lines(
                  "enum ConnectionCenterSFTPScope: Hashable {",
                  "    case pane(UUID)",
                  "}",
              ).rstrip("\n"),
              "Connection Center SFTP enum cleanup",
              re.S,
          )
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n            switch scope \{\n.*?\n            \}\n        case let \.profileTunnel",
              lines(
                  "        case let .sftp(.pane(paneID)):",
                  "            \"sftp:pane:\\(paneID.uuidString)\"",
                  "        case let .profileTunnel",
              ).rstrip("\n"),
              "Connection Center SFTP stable ID cleanup",
              re.S,
          )
          path.write_text(text)

          # With the enum reduced, AppModel can use direct exhaustive pane cases.
          path = Path("Sources/SelectiveRemote/AppModel.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n            switch scope \{\n            case let \.pane\(paneID\):\n                guard let pane = sftpWorkspace\.pane\(id: paneID\),\n                      let settings = pane\.session\.settings else \{ return \}\n                pane\.session\.disconnect\(\)\n                pane\.session\.connect\(settings\)\n            case \.profile, \.global:\n                break\n            \}",
              lines(
                  "        case let .sftp(.pane(paneID)):",
                  "            guard let pane = sftpWorkspace.pane(id: paneID),",
                  "                  let settings = pane.session.settings else { return }",
                  "            pane.session.disconnect()",
                  "            pane.session.connect(settings)",
              ).rstrip("\n"),
              "AppModel SFTP reconnect cleanup",
          )
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n            switch scope \{\n            case let \.pane\(paneID\):\n                sftpWorkspace\.pane\(id: paneID\)\?\.clear\(\)\n            case \.profile, \.global:\n                break\n            \}",
              lines(
                  "        case let .sftp(.pane(paneID)):",
                  "            sftpWorkspace.pane(id: paneID)?.clear()",
              ).rstrip("\n"),
              "AppModel SFTP disconnect cleanup",
          )
          path.write_text(text)

          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n            switch scope \{\n.*?\n            \}\n        case let \.profileTunnel",
              lines(
                  "        case let .sftp(.pane(paneID)):",
                  "            if let tab = model.sftpWorkspace.tab(containing: paneID) {",
                  "                model.sftpWorkspace.selectedTabID = tab.id",
                  "            }",
                  "            setMainArea(.sftp)",
                  "        case let .profileTunnel",
              ).rstrip("\n"),
              "final Connection Center SFTP open route",
              re.S,
          )
          path.write_text(text)

          # Normalize indentation left by the earlier targeted DnD carriers.
          path = Path("Sources/SelectiveRemote/SFTPWorkspace.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"            \.onDrop\(\n\s*of: sftpWorkspaceDropTypeIdentifiers,\n\s*isTargeted: \$dropTargeted\n\s*\) \{ providers in\n\s*acceptDrops\(providers, destination: model\.currentDirectory\)\n\s*\}",
              lines(
                  "            .onDrop(",
                  "                of: sftpWorkspaceDropTypeIdentifiers,",
                  "                isTargeted: $dropTargeted",
                  "            ) { providers in",
                  "                acceptDrops(providers, destination: model.currentDirectory)",
                  "            }",
              ).rstrip("\n"),
              "local pane drop formatting",
          )
          text = sub_once(
              text,
              r"        let stringProviders = providers\.filter \{\n.*?\n        let fileProviders = providers\.filter \{",
              lines(
                  "        let stringProviders = providers.filter {",
                  "            $0.hasItemConformingToTypeIdentifier(",
                  "                NSPasteboard.PasteboardType.string.rawValue",
                  "            )",
                  "        }",
                  "        if !stringProviders.isEmpty {",
                  "            for provider in stringProviders {",
                  "                provider.loadDataRepresentation(",
                  "                    forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue",
                  "                ) { data, _ in",
                  "                    guard let data,",
                  "                          let value = String(data: data, encoding: .utf8)",
                  "                    else { return }",
                  "                    Task { @MainActor in",
                  "                        _ = acceptInternalRemoteDrag(",
                  "                            [value],",
                  "                            destination: destination",
                  "                        )",
                  "                    }",
                  "                }",
                  "            }",
                  "            return true",
                  "        }",
                  "",
                  "        let fileProviders = providers.filter {",
              ).rstrip("\n"),
              "local internal drop formatting",
              re.S,
          )
          text = sub_once(
              text,
              r"                \.onDrop\(\n\s*of: sftpWorkspaceDropTypeIdentifiers,\n\s*isTargeted: \$dropTargeted\n\s*\) \{ providers in\n\s*acceptDrops\(\n\s*providers,\n\s*to: remote\.currentPath,\n\s*destinationSettings: settings\n\s*\)\n\s*\}",
              lines(
                  "                .onDrop(",
                  "                    of: sftpWorkspaceDropTypeIdentifiers,",
                  "                    isTargeted: $dropTargeted",
                  "                ) { providers in",
                  "                    acceptDrops(",
                  "                        providers,",
                  "                        to: remote.currentPath,",
                  "                        destinationSettings: settings",
                  "                    )",
                  "                }",
              ).rstrip("\n"),
              "remote pane drop formatting",
          )
          remote_pattern = (
              r"    private func acceptDrops\(\n"
              r"        _ providers: \[NSItemProvider\],\n"
              r"        to destinationDirectory: String,\n"
              r"        destinationSettings: SSHConnectionSettings\n"
              r"    \) -> Bool \{\n.*?\n    \}\n\n\}"
          )
          remote_replacement = lines(
              "    private func acceptDrops(",
              "        _ providers: [NSItemProvider],",
              "        to destinationDirectory: String,",
              "        destinationSettings: SSHConnectionSettings",
              "    ) -> Bool {",
              "        let fileProviders = providers.filter {",
              "            $0.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier)",
              "        }",
              "        if !fileProviders.isEmpty {",
              "            for provider in fileProviders {",
              "                provider.loadObject(ofClass: NSURL.self) { object, _ in",
              "                    guard let nsURL = object as? NSURL else { return }",
              "                    let url = nsURL as URL",
              "                    Task { @MainActor in",
              "                        remote.upload(",
              "                            localURLs: [url],",
              "                            to: destinationDirectory,",
              "                            settings: destinationSettings",
              "                        )",
              "                    }",
              "                }",
              "            }",
              "            return true",
              "        }",
              "",
              "        let stringProviders = providers.filter {",
              "            $0.hasItemConformingToTypeIdentifier(",
              "                NSPasteboard.PasteboardType.string.rawValue",
              "            )",
              "        }",
              "        guard !stringProviders.isEmpty else { return false }",
              "        for provider in stringProviders {",
              "            provider.loadDataRepresentation(",
              "                forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue",
              "            ) { data, _ in",
              "                guard let data,",
              "                      let value = String(data: data, encoding: .utf8)",
              "                else { return }",
              "                Task { @MainActor in",
              "                    _ = acceptInternalRemoteDrag(",
              "                        [value],",
              "                        to: destinationDirectory,",
              "                        destinationSettings: destinationSettings",
              "                    )",
              "                }",
              "            }",
              "        }",
              "        return true",
              "    }",
              "}",
          ).rstrip("\n")
          text = sub_once(text, remote_pattern, remote_replacement, "remote acceptDrops formatting", re.S)
          path.write_text(text)

          # Update/add cleanup regressions only after final source shape exists.
          path = Path("Tests/SelectiveRemoteTests/SFTPLifecycleRegressionTests.swift")
          text = path.read_text()
          text = replace_once(
              text,
              '#expect(source.contains("case let .sftp(scope):"))',
              '#expect(source.contains("case let .sftp(.pane(paneID)):"))',
              "managed SFTP reconnect regression",
          )
          if "Legacy single-session SFTP runtime stays removed" not in text:
              text = text.rstrip() + "\n\n" + lines(
                  '@Test("Legacy single-session SFTP runtime stays removed")',
                  "func legacySingleSessionSFTPRuntimeStaysRemoved() throws {",
                  "    let root = URL(fileURLWithPath: #filePath)",
                  "        .deletingLastPathComponent()",
                  "        .deletingLastPathComponent()",
                  "        .deletingLastPathComponent()",
                  "    let appModel = try String(contentsOf: root.appendingPathComponent(\"Sources/SelectiveRemote/AppModel.swift\"), encoding: .utf8)",
                  "    let content = try String(contentsOf: root.appendingPathComponent(\"Sources/SelectiveRemote/ContentView.swift\"), encoding: .utf8)",
                  "    let center = try String(contentsOf: root.appendingPathComponent(\"Sources/SelectiveRemote/ConnectionCenter.swift\"), encoding: .utf8)",
                  "    let app = try String(contentsOf: root.appendingPathComponent(\"Sources/SelectiveRemote/SelectiveRemoteApp.swift\"), encoding: .utf8)",
                  '    #expect(!appModel.contains("let sftpSession = SFTPBrowserSession()"))',
                  '    #expect(!appModel.contains("globalSFTPSession"))',
                  '    #expect(!appModel.contains("sftpObservers"))',
                  '    #expect(!content.contains("showsGlobalSFTPConnectionEditor"))',
                  '    #expect(!content.contains("globalSFTPScopeID"))',
                  '    #expect(!content.contains("connectGlobalSFTP"))',
                  '    #expect(!center.contains("sftp:profile:"))',
                  '    #expect(!center.contains("sftp:global"))',
                  '    #expect(!app.contains("model.sftpSession"))',
                  "}",
              )
          path.write_text(text)

          path = Path("Tests/SelectiveRemoteTests/SFTPWorkspaceSmartLinksTests.swift")
          text = path.read_text().replace(
              "contentsOf: projectRoot\n  .appendingPathComponent",
              "contentsOf: projectRoot\n            .appendingPathComponent",
          )
          path.write_text(text)

          Path(".github/workflows/pre-release-cleanup.yml").unlink(missing_ok=True)

          app_model = Path("Sources/SelectiveRemote/AppModel.swift").read_text()
          content = Path("Sources/SelectiveRemote/ContentView.swift").read_text()
          center = Path("Sources/SelectiveRemote/ConnectionCenter.swift").read_text()
          app = Path("Sources/SelectiveRemote/SelectiveRemoteApp.swift").read_text()
          release = Path(".github/workflows/release.yml").read_text()
          for forbidden in ["let sftpSession = SFTPBrowserSession()", "globalSFTPSession", "sftpObservers"]:
              if forbidden in app_model:
                  raise SystemExit(f"legacy AppModel token remains: {forbidden}")
          for forbidden in ["showsGlobalSFTPConnectionEditor", "globalSFTPScopeID", "connectGlobalSFTP"]:
              if forbidden in content:
                  raise SystemExit(f"legacy ContentView token remains: {forbidden}")
          if "sftp:profile:" in center or "sftp:global" in center:
              raise SystemExit("legacy Connection Center SFTP scope remains")
          if "model.sftpSession" in app:
              raise SystemExit("legacy application-menu SFTP status remains")
          if "default: v0.20.6" in release:
              raise SystemExit("stale release default remains")
          HOOKPY

          git add -A
          git diff --cached --check
          swift test
          swift build -c release
          git add -A
          """)
          hook.chmod(hook.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY
