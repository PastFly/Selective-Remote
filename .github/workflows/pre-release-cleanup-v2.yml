name: Final pre-release SFTP cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: macos-14
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str, flags=re.S) -> str:
              result, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return result

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # AppModel: SFTPWorkspaceModel becomes the only SFTP runtime source of truth.
          path = Path("Sources/SelectiveRemote/AppModel.swift")
          text = path.read_text()
          text = replace_once(
              text,
              "    let sftpSession = SFTPBrowserSession()\n    let globalSFTPSession = SFTPBrowserSession()\n",
              "",
              "legacy AppModel SFTP sessions",
          )
          text = replace_once(
              text,
              "    private var sftpObservers: [AnyCancellable] = []\n",
              "",
              "legacy SFTP observers property",
          )
          text = sub_once(
              text,
              r"\n        sftpObservers = \[\n.*?\n        \]\n",
              "\n",
              "legacy SFTP observer wiring",
          )
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n\s+switch scope \{\n\s+case let \.pane\(paneID\):\n\s+guard let pane = sftpWorkspace\.pane\(id: paneID\),\n\s+let settings = pane\.session\.settings else \{ return \}\n\s+pane\.session\.disconnect\(\)\n\s+pane\.session\.connect\(settings\)\n\s+case \.profile, \.global:\n\s+break\n\s+\}\n",
              "        case let .sftp(.pane(paneID)):\n            guard let pane = sftpWorkspace.pane(id: paneID),\n                  let settings = pane.session.settings else { return }\n            pane.session.disconnect()\n            pane.session.connect(settings)\n",
              "Connection Center SFTP reconnect cleanup",
          )
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n\s+switch scope \{\n\s+case let \.pane\(paneID\):\n\s+sftpWorkspace\.pane\(id: paneID\)\?\.clear\(\)\n\s+case let \.profile\(profileID\):\n\s+if sftpSession\.profileID == profileID \{\n\s+sftpSession\.disconnect\(\)\n\s+\}\n\s+case \.global:\n\s+globalSFTPSession\.disconnect\(\)\n\s+\}\n",
              "        case let .sftp(.pane(paneID)):\n            sftpWorkspace.pane(id: paneID)?.clear()\n",
              "Connection Center SFTP disconnect cleanup",
          )
          path.write_text(text)

          # Connection Center: SFTP sources are real Workspace panes only.
          path = Path("Sources/SelectiveRemote/ConnectionCenter.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"enum ConnectionCenterSFTPScope: Hashable \{\n\s+case pane\(UUID\)\n\s+case profile\(UUID\)\n\s+case global\n\}",
              "enum ConnectionCenterSFTPScope: Hashable {\n    case pane(UUID)\n}",
              "legacy Connection Center SFTP scope enum",
          )
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n\s+switch scope \{\n\s+case let \.pane\(paneID\):\n\s+\"sftp:pane:\\\(paneID\.uuidString\)\"\n\s+case let \.profile\(profileID\):\n\s+\"sftp:profile:\\\(profileID\.uuidString\)\"\n\s+case \.global:\n\s+\"sftp:global\"\n\s+\}\n",
              "        case let .sftp(.pane(paneID)):\n            \"sftp:pane:\\(paneID.uuidString)\"\n",
              "legacy Connection Center SFTP stable IDs",
          )
          path.write_text(text)

          # Workspace: expose aggregate transfer state/actions for MenuBarExtra.
          path = Path("Sources/SelectiveRemote/SFTPWorkspace.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"    var activeRemoteCount: Int \{\n\s+tabs\.reduce\(0\) \{ \$0 \+ \$1\.remoteConnectionCount \}\n\s+\}\n",
              """    var activeRemoteCount: Int {
              tabs.reduce(0) { $0 + $1.remoteConnectionCount }
          }

              var transferQueues: [SFTPTransferQueue] {
              tabs.flatMap { [$0.left.session.transfers, $0.right.session.transfers] }
          }

              var activeTransferCount: Int {
              transferQueues.reduce(0) { $0 + $1.activeCount }
          }

              var hasTransferItems: Bool {
              transferQueues.contains { !$0.items.isEmpty }
          }

              var hasPausedTransfers: Bool {
              transferQueues.contains { queue in
                  queue.items.contains { $0.phase == .paused }
              }
          }

              func pauseAllTransfers() {
              transferQueues.forEach { $0.pauseAll() }
          }

              func resumeAllTransfers() {
              transferQueues.forEach { $0.resumeAll() }
          }

              func cancelAllTransfers() {
              transferQueues.forEach { $0.cancelAll() }
          }
          """,
              "Workspace transfer aggregation",
          )
          path.write_text(text)

          # ContentView: remove unreachable pre-Workspace global SFTP runtime/editor.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"    private static let globalSFTPScopeID = UUID\(\n\s+uuidString: \"9C99721B-CFF3-48B7-A0A4-22E627A7D56C\"\n\s+\)!\n\n",
              "",
              "legacy global SFTP scope ID",
          )
          text = sub_once(
              text,
              r"    @State private var showsGlobalSFTPConnectionEditor = false\n    @State private var globalSFTPConnection: TerminalTabConnection\?\n",
              "",
              "legacy global SFTP state",
          )
          text = sub_once(
              text,
              r"\n        \.sheet\(isPresented: \$showsGlobalSFTPConnectionEditor\) \{\n.*?\n        \}\n        \.onAppear \{",
              "\n        .onAppear {",
              "legacy global SFTP sheet",
          )
          text = sub_once(
              text,
              r"    private var globalSFTPProfile: ConnectionProfile \{.*?(?=    @ViewBuilder\n    private var selectedSettingsContent: some View \{)",
              "",
              "legacy global SFTP helpers",
          )
          text = sub_once(
              text,
              r"\s+if area == \.sftp,\n\s+model\.globalSFTPSession\.settings != nil \{\n\s+Image\(systemName: \"circle\.fill\"\)\n\s+\.font\(\.system\(size: 7\)\)\n\s+\.foregroundStyle\(\.green\)\n\s+\}",
              "\n                            if area == .sftp {\n                                SFTPWorkspaceSidebarStatus(workspace: model.sftpWorkspace)\n                            }",
              "legacy sidebar SFTP indicator",
          )
          text = sub_once(
              text,
              r"        case let \.sftp\(scope\):\n\s+switch scope \{.*?\s+case \.global:\n\s+setMainArea\(\.sftp\)\n\s+\}\n(?=        case let \.profileTunnel)",
              "        case let .sftp(.pane(paneID)):\n            if let tab = model.sftpWorkspace.tab(containing: paneID) {\n                model.sftpWorkspace.selectedTabID = tab.id\n            }\n            setMainArea(.sftp)\n",
              "Connection Center SFTP open cleanup",
          )
          text = replace_once(
              text,
              "struct ContentView: View {\n",
              """private struct SFTPWorkspaceSidebarStatus: View {
              @ObservedObject var workspace: SFTPWorkspaceModel

              var body: some View {
              if workspace.activeRemoteCount > 0 {
                  Image(systemName: "circle.fill")
                      .font(.system(size: 7))
                      .foregroundStyle(.green)
              }
              }
          }

          struct ContentView: View {
          """,
              "Workspace sidebar observer",
          )
          path.write_text(text)

          # MenuBarExtra: keep controls, now over all real Workspace transfer queues.
          path = Path("Sources/SelectiveRemote/SelectiveRemoteApp.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"            if !model\.sftpSession\.transfers\.items\.isEmpty \{\n.*?            \}\n(?=            Divider\(\)\n            Button\(\"Открыть приложение\")",
              "            SFTPMenuBarTransferControls(workspace: model.sftpWorkspace)\n",
              "legacy MenuBarExtra SFTP queue",
          )
          text = replace_once(
              text,
              "@main\nstruct SelectiveRemoteApp: App {\n",
              """private struct SFTPMenuBarTransferControls: View {
              @ObservedObject var workspace: SFTPWorkspaceModel

              var body: some View {
              if workspace.hasTransferItems {
                  Divider()
                  Text("SFTP-передачи: \\(workspace.activeTransferCount) активных")
                  if workspace.hasPausedTransfers {
                      Button("Продолжить SFTP-передачи", systemImage: "play.fill") {
                          workspace.resumeAllTransfers()
                      }
                  } else if workspace.activeTransferCount > 0 {
                      Button("Приостановить SFTP-передачи", systemImage: "pause.fill") {
                          workspace.pauseAllTransfers()
                      }
                  }
                  Button("Отменить SFTP-передачи", role: .destructive) {
                      workspace.cancelAllTransfers()
                  }
                  .disabled(workspace.activeTransferCount == 0)
              }
              }
          }

          @main
          struct SelectiveRemoteApp: App {
          """,
              "Workspace MenuBarExtra controls",
          )
          path.write_text(text)

          # Delete obsolete pre-Workspace SFTP view.
          legacy_view = Path("Sources/SelectiveRemote/SFTPBrowserView.swift")
          if not legacy_view.exists():
              raise SystemExit("legacy SFTPBrowserView.swift unexpectedly missing")
          legacy_view.unlink()

          # Source-contract tests follow the single Workspace architecture.
          path = Path("Tests/SelectiveRemoteTests/SFTPLifecycleRegressionTests.swift")
          text = path.read_text()
          text = replace_once(
              text,
              '#expect(source.contains("case let .sftp(scope):"))',
              '#expect(source.contains("case let .sftp(.pane(paneID)):"))',
              "managed SFTP reconnect expectation",
          )
          if "Legacy single-session SFTP runtime stays removed" not in text:
              text += r'''

          @Test("Legacy single-session SFTP runtime stays removed")
          func legacySingleSessionSFTPRuntimeStaysRemoved() throws {
              let root = URL(fileURLWithPath: #filePath)
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
              let appModel = try String(contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/AppModel.swift"), encoding: .utf8)
              let content = try String(contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/ContentView.swift"), encoding: .utf8)
              let app = try String(contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/SelectiveRemoteApp.swift"), encoding: .utf8)
              let center = try String(contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/ConnectionCenter.swift"), encoding: .utf8)
              #expect(!appModel.contains("let sftpSession = SFTPBrowserSession()"))
              #expect(!appModel.contains("globalSFTPSession"))
              #expect(!appModel.contains("sftpObservers"))
              #expect(!content.contains("showsGlobalSFTPConnectionEditor"))
              #expect(!content.contains("connectGlobalSFTP"))
              #expect(!center.contains("case profile(UUID)"))
              #expect(!center.contains("sftp:global"))
              #expect(!FileManager.default.fileExists(atPath: root.appendingPathComponent("Sources/SelectiveRemote/SFTPBrowserView.swift").path))
              #expect(app.contains("SFTPMenuBarTransferControls(workspace: model.sftpWorkspace)"))
          }
          '''
          path.write_text(text)

          path = Path("Tests/SelectiveRemoteTests/TerminalTests.swift")
          text = path.read_text()
          text = sub_once(
              text,
              r"    #expect\(content\.contains\(\"model\.globalSFTPSession\"\)\)\n    #expect\(content\.contains\(\"showsGlobalSFTPConnectionEditor\"\)\)\n",
              "    #expect(content.contains(\"SFTPWorkspaceView(workspace: model.sftpWorkspace)\"))\n    #expect(!content.contains(\"showsGlobalSFTPConnectionEditor\"))\n",
              "global SFTP Workspace expectations",
          )
          path.write_text(text)

          # Release workflow must require an explicitly typed tag.
          path = Path(".github/workflows/release.yml")
          text = path.read_text()
          text = replace_once(text, "        default: v0.20.6\n", "", "obsolete release default")
          path.write_text(text)

          # Hard invariants before compile/tests.
          app_model = Path("Sources/SelectiveRemote/AppModel.swift").read_text()
          content = Path("Sources/SelectiveRemote/ContentView.swift").read_text()
          app = Path("Sources/SelectiveRemote/SelectiveRemoteApp.swift").read_text()
          center = Path("Sources/SelectiveRemote/ConnectionCenter.swift").read_text()
          workspace = Path("Sources/SelectiveRemote/SFTPWorkspace.swift").read_text()
          release = Path(".github/workflows/release.yml").read_text()
          for forbidden in ["let sftpSession = SFTPBrowserSession()", "globalSFTPSession", "sftpObservers"]:
              if forbidden in app_model:
                  raise SystemExit(f"legacy AppModel SFTP token remains: {forbidden}")
          for forbidden in ["showsGlobalSFTPConnectionEditor", "globalSFTPScopeID", "connectGlobalSFTP"]:
              if forbidden in content:
                  raise SystemExit(f"legacy ContentView SFTP token remains: {forbidden}")
          if "model.sftpSession" in app:
              raise SystemExit("MenuBarExtra still references legacy SFTP session")
          if "case profile(UUID)" in center or "sftp:global" in center:
              raise SystemExit("legacy Connection Center SFTP scopes remain")
          if "var activeTransferCount: Int" not in workspace or "func cancelAllTransfers()" not in workspace:
              raise SystemExit("Workspace transfer aggregation missing")
          if "default: v0.20.6" in release:
              raise SystemExit("obsolete release default remains")
          if Path("Sources/SelectiveRemote/SFTPBrowserView.swift").exists():
              raise SystemExit("legacy SFTPBrowserView.swift still exists")
          PY
