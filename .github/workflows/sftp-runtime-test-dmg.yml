name: SFTP Runtime Test DMG

on:
  pull_request:
    branches: [main]
    paths:
      - "Sources/SelectiveRemote/SFTPControlPathGate.swift"
      - "Sources/SelectiveRemote/SFTPService.swift"
      - "Sources/SelectiveRemote/SFTPTransferQueue.swift"
      - "Tests/SelectiveRemoteTests/SFTPRuntimeBehaviorTests.swift"
      - ".github/workflows/sftp-runtime-test-dmg.yml"

permissions:
  contents: read

concurrency:
  group: sftp-runtime-test-dmg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test-dmg:
    name: Build ARM64 test DMG on Xcode 16.2
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SELECTIVEREMOTE_UPDATE_FEED_URL: https://raw.githubusercontent.com/PastFly/Selective-Remote/main/Resources/updates.json

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Install build dependencies
        run: brew install freerdp sdl3

      - name: Build test DMG
        run: ./scripts/build_app.sh

      - name: Upload test DMG
        uses: actions/upload-artifact@v4
        with:
          name: SelectiveRemote-0.22.5-sftp-runtime-test
          path: |
            dist/SelectiveRemote-0.22.5-arm64.dmg
            dist/SelectiveRemote-0.22.5-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 7
