name: Set v0.27 test version

on:
  push:
    branches:
      - feature/v0.27.0-terminal-ux
    paths:
      - .github/workflows/v027-version-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.27.0-terminal-ux
          fetch-depth: 0
      - run: python3 scripts/v027_set_test_version.py
      - name: Commit test version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build_app.sh scripts/v027_set_test_version.py .github/workflows/v027-version-patch.yml
          git diff --cached --check
          git commit -m "v0.27.0: set test build version 140"
          git push origin HEAD:feature/v0.27.0-terminal-ux
