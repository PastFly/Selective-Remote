name: Check live Cloud writer admission
on:
  push:
    branches: [codex/verify-restore-session-expiry]
permissions:
  contents: read
jobs:
  public-preflight:
    name: Read-only Cloud HTTPS preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read health, readiness and writer capability
        run: |
          set -euo pipefail
          origin=https://cloud.pastfly.ru
          curl --fail --silent --show-error --proto '=https' --max-time 15 "$origin/healthz"
          printf '\n'
          curl --fail --silent --show-error --proto '=https' --max-time 15 "$origin/readyz"
          printf '\n'
          curl --fail --silent --show-error --proto '=https' --max-time 15 --dump-header "$RUNNER_TEMP/cloud-meta.headers" --output "$RUNNER_TEMP/cloud-meta.json" "$origin/v1/meta"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const [headerPath, metadataPath] = process.argv.slice(1);
            const headers = readFileSync(headerPath, "utf8");
            const meta = JSON.parse(readFileSync(metadataPath, "utf8"));
            const writer = /^x-selective-v1-write-fence:[ \t]*1\r?$/im.test(headers);
            const pause = /^x-selective-v1-write-status:[ \t]*vault_write_temporarily_unavailable\r?$/im.test(headers);
            console.log(JSON.stringify({apiVersion: meta.apiVersion, vaultSchemaVersion: meta.vaultSchemaVersion, registrationEnabled: meta.registrationEnabled, writerCapability: writer, writePauseAdvertised: pause, publicReadOnly: true}));
          ' "$RUNNER_TEMP/cloud-meta.headers" "$RUNNER_TEMP/cloud-meta.json"
