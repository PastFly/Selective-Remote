name: Verify PostgreSQL restore transaction
on:
  push:
    branches: [codex/verify-restore-session-expiry]
permissions:
  contents: read
jobs:
  isolated-restore:
    name: Restore disposable PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
        env:
          POSTGRES_DB: restore_test
          POSTGRES_USER: restore_fixture
          POSTGRES_PASSWORD: ephemeral-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_fixture -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify candidate Cloud tree
        run: git diff --exit-code c01385556edc67e10be3184c7531c44e2c5207d1 HEAD -- cloud/
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Install Cloud dependencies
        working-directory: cloud
        run: npm ci --ignore-scripts
      - name: Verify success and rollback without application traffic
        working-directory: cloud
        env:
          TEST_DATABASE_URL: postgresql://restore_fixture:ephemeral-integration-only@127.0.0.1:5432/restore_test
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          pg_restore --version
          psql --version
          node --test tests/backup-restore.test.mjs tests/backup-postgres-concurrency.test.mjs
