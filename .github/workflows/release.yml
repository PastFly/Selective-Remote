name: Release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ARM64 DMG
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      published: ${{ steps.publish.outputs.published }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          tag="$REQUESTED_TAG"
          if [[ "$tag" != "v${version}" ]]; then
            echo "Tag $tag does not match VERSION=${version}." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$tag")"
          source_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$source_commit" ]]; then
            echo "Tag $tag points to $tag_commit instead of checked-out $source_commit." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Select Swift 6 toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Validate fail-closed official release contract
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPECTED_SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          node scripts/official_release_preflight.mjs

      - name: Install build dependencies
        run: brew install freerdp sdl3

      - name: Configure required Developer ID signing and notarization
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPECTED_SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/selective-remote.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          export P12_BASE64 API_KEY_BASE64 certificate api_key
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["certificate"]).write_bytes(base64.b64decode(os.environ["P12_BASE64"]))
          Path(os.environ["api_key"]).write_bytes(base64.b64decode(os.environ["API_KEY_BASE64"]))
          PY

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -Fq "\"$EXPECTED_SIGNING_IDENTITY\""
          security find-certificate -c "$EXPECTED_SIGNING_IDENTITY" -p "$keychain" \
            | openssl x509 -noout -subject \
            | grep -Eq "OU ?= ?${EXPECTED_TEAM_ID}([,/]|$)"
          xcrun notarytool store-credentials "SelectiveRemote-notary" \
            --key "$api_key" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID"

      - name: Build, sign and notarize DMG
        shell: bash
        env:
          SELECTIVEREMOTE_RELEASE_MODE: official
          SELECTIVEREMOTE_CODESIGN_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          SELECTIVEREMOTE_EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SELECTIVEREMOTE_NOTARY_PROFILE: SelectiveRemote-notary
          SELECTIVEREMOTE_UPDATE_FEED_URL: https://raw.githubusercontent.com/PastFly/Selective-Remote/main/Resources/updates.json
        run: |
          set -euo pipefail
          ./scripts/build_app.sh

      - name: Publish GitHub Release assets
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          hashes=(dist/*.dmg.sha256)
          if [[ ${#dmgs[@]} -ne 1 || ${#hashes[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG and one SHA-256 file." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase VERSION and publish a new tag." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$TAG")"
          if [[ "$tag_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Tag $TAG points to $tag_commit instead of checked-out $SOURCE_COMMIT." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_notes.py "${TAG#v}" > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "Release notes for $TAG are empty." >&2
            exit 1
          fi
          gh release create "$TAG" "${dmgs[0]}" "${hashes[0]}" \
            --verify-tag \
            --title "Selective Remote ${TAG#v}" \
            --notes-file "$notes" \
            --fail-on-no-commits \
            --latest
          echo "published=true" >> "$GITHUB_OUTPUT"


  announce-telegram:
    name: Announce published Release in Telegram
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/telegram-release.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
