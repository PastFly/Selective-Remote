name: Release DMG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build_app.sh"
      - "Resources/updates.json"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ARM64 DMG
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          tag="${REQUESTED_TAG:-v${version}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already exists; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Swift 6 toolchain
        if: steps.release.outputs.publish == 'true'
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Validate tag and source version
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          build="$(sed -nE 's/^BUILD_NUMBER="([^"]+)"/\1/p' scripts/build_app.sh)"
          manifest_version="$(python3 -c 'import json; print(json.load(open("Resources/updates.json"))["version"])')"
          manifest_build="$(python3 -c 'import json; print(json.load(open("Resources/updates.json"))["build"])')"
          manifest_download="$(python3 -c 'import json; print(json.load(open("Resources/updates.json"))["downloadURL"])')"
          manifest_notes="$(python3 -c 'import json; print(json.load(open("Resources/updates.json"))["releaseNotesURL"])')"
          if [[ "$TAG" != "v${version}" ]]; then
            echo "Tag $TAG does not match VERSION=${version}." >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$version" || "$manifest_build" != "$build" ]]; then
            echo "Resources/updates.json does not match VERSION/BUILD_NUMBER." >&2
            exit 1
          fi
          expected_download="https://github.com/PastFly/Selective-Remote/releases/download/v${version}/SelectiveRemote-${version}-arm64.dmg"
          expected_notes="https://github.com/PastFly/Selective-Remote/releases/tag/v${version}"
          if [[ "$manifest_download" != "$expected_download" || "$manifest_notes" != "$expected_notes" ]]; then
            echo "Resources/updates.json points to a different GitHub Release." >&2
            exit 1
          fi

      - name: Install build dependencies
        if: steps.release.outputs.publish == 'true'
        run: brew install freerdp sdl3

      - name: Configure Developer ID signing when secrets are present
        if: steps.release.outputs.publish == 'true'
        id: signing
        shell: bash
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64$P12_PASSWORD$API_KEY_BASE64$API_KEY_ID$API_ISSUER_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple secrets are absent; the Release will contain an ad-hoc signed community DMG."
            exit 0
          fi
          for value in "$P12_BASE64" "$P12_PASSWORD" "$API_KEY_BASE64" "$API_KEY_ID" "$API_ISSUER_ID"; do
            if [[ -z "$value" ]]; then
              echo "Apple signing secrets are only partially configured." >&2
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/selective-remote.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          export P12_BASE64 API_KEY_BASE64 certificate api_key
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["certificate"]).write_bytes(base64.b64decode(os.environ["P12_BASE64"]))
          Path(os.environ["api_key"]).write_bytes(base64.b64decode(os.environ["API_KEY_BASE64"]))
          PY

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          xcrun notarytool store-credentials "SelectiveRemote-notary" \
            --key "$api_key" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize DMG
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SELECTIVEREMOTE_UPDATE_FEED_URL: https://raw.githubusercontent.com/PastFly/Selective-Remote/main/Resources/updates.json
        run: |
          set -euo pipefail
          if [[ "$SIGNING_ENABLED" == "true" ]]; then
            export SELECTIVEREMOTE_NOTARY_PROFILE="SelectiveRemote-notary"
          fi
          ./scripts/build_app.sh

      - name: Publish GitHub Release assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          hashes=(dist/*.dmg.sha256)
          if [[ ${#dmgs[@]} -ne 1 || ${#hashes[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG and one SHA-256 file." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase VERSION and publish a new tag." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
              tag_commit="$(git rev-list -n 1 "$TAG")"
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "Tag $TAG already points to $tag_commit instead of $GITHUB_SHA." >&2
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Selective Remote ${TAG#v}" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
            fi
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_notes.py "${TAG#v}" > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "Release notes for $TAG are empty." >&2
            exit 1
          fi
          gh release create "$TAG" "${dmgs[0]}" "${hashes[0]}" \
            --verify-tag \
            --title "Selective Remote ${TAG#v}" \
            --notes-file "$notes" \
            --fail-on-no-commits \
            --latest
