name: Add v0.27 test changelog

on:
  push:
    branches:
      - feature/v0.27.0-terminal-ux
    paths:
      - .github/workflows/v027-changelog-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.27.0-terminal-ux
          fetch-depth: 0
      - name: Prepend v0.27 changelog sections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ru = """## 0.27.0\n\n- SSH-профили и группы получили упорядоченные Startup Snippets: можно добавить до восьми Snippets, менять порядок и запускать последовательность после появления shell prompt.\n- Одиночный Startup Snippet остаётся обратно совместимым; последовательности используют существующий SSH runtime и не создают второй движок выполнения.\n- Исправлена читаемость checkbox в светлой теме, включая настройки подключений и POSIX-права SFTP.\n- History/Snippets используют единый полноразмерный Inspector в SSH single/split/grid, терминале SSH-профиля из «Подключений» и локальном «Терминале».\n- Добавлены regression-тесты для Startup Sequence, Inspector UX и checkbox-контраста.\n\n"""
          en = """## 0.27.0\n\n- SSH profiles and groups now support ordered Startup Snippets: add up to eight Snippets, reorder them, and run the sequence after the shell prompt appears.\n- A single Startup Snippet remains backward compatible; sequences reuse the existing SSH runtime instead of introducing a second execution engine.\n- Improved checkbox contrast in the light theme, including connection settings and SFTP POSIX permissions.\n- History/Snippets now use one full-size Inspector in SSH single/split/grid, the SSH profile terminal under Connections, and the local Terminal.\n- Added regression coverage for Startup Sequence, Inspector UX, and checkbox contrast.\n\n"""
          for filename, section in [("CHANGELOG.md", ru), ("CHANGELOG_EN.md", en)]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if not text.startswith("## 0.27.0\n"):
                  path.write_text(section + text, encoding="utf-8")
          Path(".github/workflows/v027-changelog-patch.yml").unlink(missing_ok=True)
          PY
      - name: Commit changelog and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md CHANGELOG_EN.md .github/workflows/v027-changelog-patch.yml
          git diff --cached --check
          git commit -m "v0.27.0: add test candidate changelog"
          git push origin HEAD:feature/v0.27.0-terminal-ux
