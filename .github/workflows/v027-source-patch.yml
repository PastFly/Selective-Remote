name: Apply v0.27 source patch

on:
  push:
    branches:
      - feature/v0.27.0-terminal-ux
    paths:
      - .github/workflows/v027-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.27.0-terminal-ux
          fetch-depth: 0

      - name: Apply targeted source replacements
        run: python3 scripts/v027_apply_source_patch.py

      - name: Commit patched sources and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Sources/SelectiveRemote/EmbeddedTerminalView.swift Sources/SelectiveRemote/SFTPInspectorViews.swift scripts/v027_apply_source_patch.py .github/workflows/v027-source-patch.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v0.27.0: unify terminal inspectors and checkbox contrast"
          git push origin HEAD:feature/v0.27.0-terminal-ux
