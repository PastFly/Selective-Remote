name: Isolated legacy and current collection regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collections:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          set -o pipefail
          python3 Tests/IntegrityFixtures/NativeCollections/run.py 2>&1 | tee "$RUNNER_TEMP/evidence/collections.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-legacy-current-collections
          path: ${{ runner.temp }}/evidence
          retention-days: 14
