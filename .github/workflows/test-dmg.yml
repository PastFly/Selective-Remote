name: Real app 0.31 migration crash boundaries
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Reuse verified test-only instrumented application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          gh run download 42005463911 --repo PastFly/Selective-Remote --name synthetic-instrumented-migration-app --dir "$RUNNER_TEMP/image"
          (cd "$RUNNER_TEMP/image"; shasum -a 256 -c ./*.dmg.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-instrumented-migration-app
          path: ${{ runner.temp }}/image
          retention-days: 7
  crash:
    needs: build
    runs-on: macos-14
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        phase: [after-snapshot, after-marker]
    env:
      SR_GUI_FAULT_PHASE: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-instrumented-migration-app
          path: ${{ runner.temp }}/image
      - name: Crash during actual 0.31 migration checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SR_GUI_FAULT_ROOT: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true && test "${RUNNER_ENVIRONMENT:-}" = github-hosted && test "${USER:-}" = runner
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/candidate-mount" "$RUNNER_TEMP/baseline"
          keychain="$RUNNER_TEMP/selective-remote-synthetic.keychain-db"
          original_default=$(security default-keychain -d user | python3 -c 'import shlex,sys; a=shlex.split(sys.stdin.read()); print(a[0] if a else "")')
          original_keychains=()
          while IFS= read -r item; do original_keychains+=("$item"); done < <(security list-keychains -d user | python3 -c 'import shlex,sys; print("\n".join(shlex.split(sys.stdin.read())))')
          cleanup() {
            result=$?
            if [[ "$result" -ne 0 ]]; then screencapture -x "$RUNNER_TEMP/evidence/failure.png" || true; fi
            if [[ -n "${app_pid:-}" ]]; then kill -KILL "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; fi
            hdiutil detach "$RUNNER_TEMP/candidate-mount" >/dev/null 2>&1 || true
            if [[ -n "$original_default" ]]; then security default-keychain -d user -s "$original_default" || true; fi
            if [[ "${#original_keychains[@]}" -gt 0 ]]; then security list-keychains -d user -s "${original_keychains[@]}" || true; fi
            security delete-keychain "$keychain" || true
          }
          trap cleanup EXIT
          password=$(openssl rand -hex 24)
          umask 077
          printf %s "$password" > "$RUNNER_TEMP/synthetic-keychain-password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          gh release download v0.31.0 --repo PastFly/Selective-Remote --pattern 'SelectiveRemote-0.31.0-arm64.dmg*' --dir "$RUNNER_TEMP/baseline"
          (cd "$RUNNER_TEMP/baseline"; echo '1aeb31f5992216ac8aed3109b509c3fda78941adeef6142fbefbbeba1181a37f  SelectiveRemote-0.31.0-arm64.dmg' | shasum -a 256 -c -)
          (cd "$RUNNER_TEMP/image"; shasum -a 256 -c ./*.dmg.sha256)
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/candidate-mount" "$RUNNER_TEMP/baseline/SelectiveRemote-0.31.0-arm64.dmg" >/dev/null
          app="$RUNNER_TEMP/candidate-mount/Selective Remote.app"
          codesign --verify --deep --strict "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          if defaults read "$bundle" >/dev/null 2>&1; then echo 'Synthetic defaults domain not empty'; exit 1; fi
          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          hash=$(shasum -a 256 "$binary" | cut -d ' ' -f 1)
          cp scripts/isolated-gui-smoke/probe.swift "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/gui-probe"
          cp scripts/isolated-gui-smoke/SecurityPrompt.swift "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/security-prompt"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/old-app.log" 2>&1 & app_pid=$!
          sleep 12; kill -0 "$app_pid"
          SR_BUILD_KIND=baseline SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" python3 scripts/isolated-gui-smoke/run-bounded.py 120 "$RUNNER_TEMP/gui-probe" "$app_pid" --create-live-old > "$RUNNER_TEMP/evidence/old-create.log"
          SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" "$RUNNER_TEMP/gui-probe" "$app_pid" --terminate
          wait "$app_pid" || true; app_pid=""
          defaults export "$bundle" "$RUNNER_TEMP/before.plist"
          hdiutil detach "$RUNNER_TEMP/candidate-mount" >/dev/null
          images=("$RUNNER_TEMP"/image/*.dmg); test "${#images[@]}" -eq 1
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/candidate-mount" "${images[0]}" >/dev/null
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$bundle"
          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          hash=$(shasum -a 256 "$binary" | cut -d ' ' -f 1)
          printf armed > "$RUNNER_TEMP/gui-fault-arm"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/current-app.log" 2>&1 & app_pid=$!
          for attempt in {1..300}; do
            test -f "$RUNNER_TEMP/gui-fault-reached" && break
            kill -0 "$app_pid" || { echo 'app exited before migration boundary'; exit 1; }
            sleep 0.1
          done
          test "$(cat "$RUNNER_TEMP/gui-fault-reached")" = "$SR_GUI_FAULT_PHASE"
          ps -o state= -p "$app_pid" | grep -q T
          kill -KILL "$app_pid"; wait "$app_pid" 2>/dev/null || true; app_pid=""
          rm -f "$RUNNER_TEMP/gui-fault-arm"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/restart.log" 2>&1 & app_pid=$!
          SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" python3 scripts/isolated-gui-smoke/run-bounded.py 35 "$RUNNER_TEMP/security-prompt" "$RUNNER_TEMP/synthetic-keychain-password" "$app_pid" 031 candidate > "$RUNNER_TEMP/evidence/security-prompt.log"
          sleep 3; kill -0 "$app_pid"
          SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" "$RUNNER_TEMP/gui-probe" "$app_pid" --terminate
          wait "$app_pid" || true; app_pid=""
          defaults export "$bundle" "$RUNNER_TEMP/recovered.plist"
          python3 scripts/isolated-migration-gui-crash/verify.py "$RUNNER_TEMP/before.plist" "$RUNNER_TEMP/recovered.plist" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-real-app-migration-crash-${{ matrix.phase }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
