name: Synthetic Snippet group transaction crash
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fault:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compile exact Snippet store source with isolated fault adapter
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true && test "${RUNNER_ENVIRONMENT:-}" = github-hosted && test "${USER:-}" = runner
          mkdir -p "$RUNNER_TEMP/evidence"
          shasum -a 256 Sources/SelectiveRemote/TerminalCommandHistory.swift Sources/SelectiveRemote/NativeStorageMigration.swift Sources/SelectiveRemote/NativeStorageLease.swift > "$RUNNER_TEMP/evidence/source-sha256.txt"
          swiftc Sources/SelectiveRemote/TerminalCommandHistory.swift Sources/SelectiveRemote/NativeStorageMigration.swift Sources/SelectiveRemote/NativeStorageLease.swift scripts/isolated-snippet-boundaries/main.swift -o "$RUNNER_TEMP/snippet-fault"
      - name: Kill between actual group and Snippet writes
        env:
          SR_SNIPPET_FAULT_ROOT: ${{ runner.temp }}/snippet-write-boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/isolated-snippet-boundaries/supervise.py "$RUNNER_TEMP/snippet-fault" "$RUNNER_TEMP/evidence" | tee "$RUNNER_TEMP/evidence/boundaries.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-snippet-group-atomicity
          path: ${{ runner.temp }}/evidence
          retention-days: 14
