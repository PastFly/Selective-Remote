name: Journal checkpoint failure boundaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated journal lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/harness-sha.txt"
          git show HEAD:cloud/src/migration-fence.mjs | sha256sum > "$RUNNER_TEMP/evidence/source.sha256"
          node --test cloud/tests/migration-fence-anchored-compact.test.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/journal-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-checkpoint-boundaries
          path: ${{ runner.temp }}/evidence
          retention-days: 14
