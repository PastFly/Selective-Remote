name: Disposable macOS backup authentication availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect device-owner authentication availability
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true && test "${RUNNER_ENVIRONMENT:-}" = github-hosted && test "${USER:-}" = runner
          mkdir -p "$RUNNER_TEMP/evidence"
          swiftc scripts/isolated-gui-smoke/DeviceOwnerAvailability.swift -o "$RUNNER_TEMP/device-owner-availability"
          "$RUNNER_TEMP/device-owner-availability" | tee "$RUNNER_TEMP/evidence/device-owner-availability.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-device-owner-availability
          path: ${{ runner.temp }}/evidence
          retention-days: 7
