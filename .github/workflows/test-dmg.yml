name: Exact DMG unavailable SSH acceptance macOS 14
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  favorites:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Download exact candidate DMG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=db7c5920a85c74e2008166298d2ac80cab66f857
          test "$(gh api repos/PastFly/Selective-Remote/actions/runs/41737602354 --jq 'select(.status == "completed" and .conclusion == "success") | .head_sha')" = "$expected"
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/evidence"
          gh run download 41737602354 --repo PastFly/Selective-Remote --name SelectiveRemote-test-229-arm64 --dir "$RUNNER_TEMP/image"
          (cd "$RUNNER_TEMP/image"; shasum -a 256 -c ./*.dmg.sha256; echo '500b6b4c6ba6f4c0e84444c6de7fb7f787999f50f5728d5e1158da75278fd37e  SelectiveRemote-0.32.0-arm64.dmg' | shasum -a 256 -c -)
          printf 'candidate=%s\nrunner=%s\n' "$expected" "$RUNNER_OS" > "$RUNNER_TEMP/evidence/provenance.txt"
      - name: Exercise favorite and restart with synthetic Host
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true && test "${RUNNER_ENVIRONMENT:-}" = github-hosted && test "${USER:-}" = runner
          keychain="$RUNNER_TEMP/selective-remote-synthetic.keychain-db"
          original_default=$(security default-keychain -d user | python3 -c 'import shlex,sys; a=shlex.split(sys.stdin.read()); print(a[0] if a else "")')
          original_keychains=()
          while IFS= read -r item; do original_keychains+=("$item"); done < <(security list-keychains -d user | python3 -c 'import shlex,sys; print("\n".join(shlex.split(sys.stdin.read())))')
          cleanup() {
            result=$?
            ps -axo pid,ppid,state,comm > "$RUNNER_TEMP/evidence/processes.txt" || true
            lsof -nP -iTCP:52226 > "$RUNNER_TEMP/evidence/socket.txt" 2>&1 || true
            if [[ "$result" -ne 0 ]]; then screencapture -x "$RUNNER_TEMP/evidence/failure.png" || true; fi
            if [[ -n "${app_pid:-}" ]]; then kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; fi
            if [[ -n "${reserve_pid:-}" ]]; then kill "$reserve_pid" 2>/dev/null || true; wait "$reserve_pid" 2>/dev/null || true; fi
            hdiutil detach "$RUNNER_TEMP/candidate-mount" >/dev/null 2>&1 || true
            if [[ -n "$original_default" ]]; then security default-keychain -d user -s "$original_default" || true; fi
            if [[ "${#original_keychains[@]}" -gt 0 ]]; then security list-keychains -d user -s "${original_keychains[@]}" || true; fi
            security delete-keychain "$keychain" || true
          }
          trap cleanup EXIT
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          mkdir "$RUNNER_TEMP/candidate-mount"
          images=("$RUNNER_TEMP"/image/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/candidate-mount" "${images[0]}" >/dev/null
          app="$RUNNER_TEMP/candidate-mount/Selective Remote.app"
          codesign --verify --deep --strict "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          if defaults read "$bundle" >/dev/null 2>&1; then echo 'Synthetic defaults domain not empty'; exit 1; fi
          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          hash=$(shasum -a 256 "$binary" | cut -d ' ' -f 1)
          cp scripts/isolated-gui-smoke/probe.swift "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/gui-probe"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=yes -p 52226 runner@127.0.0.1 > "$RUNNER_TEMP/evidence/direct-ssh.txt" 2>&1
          ssh_result=$?
          set -e
          test "$ssh_result" -ne 0
          grep -i 'connection refused' "$RUNNER_TEMP/evidence/direct-ssh.txt"
          sandbox-exec -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:52226"))' "$binary" > "$RUNNER_TEMP/evidence/app.log" 2>&1 & app_pid=$!
          sleep 12; kill -0 "$app_pid"
          SR_BUILD_KIND=candidate SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" python3 scripts/isolated-gui-smoke/run-bounded.py 120 "$RUNNER_TEMP/gui-probe" "$app_pid" --unavailable-host | tee "$RUNNER_TEMP/evidence/unavailable.log"
          screencapture -x "$RUNNER_TEMP/evidence/unavailable.png"
          echo 'SYNTHETIC_UNAVAILABLE_SSH=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-exact-unavailable-ssh-macos14
          path: ${{ runner.temp }}/evidence
          retention-days: 7
