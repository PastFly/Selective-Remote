name: Snippet crash fix build and regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift-regression:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Test Swift package
        run: |
          set -o pipefail
          swift --version
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-regression.log"
      - name: Test migration fault handling
        run: |
          set -o pipefail
          python3 Tests/IntegrityFixtures/NativeStorageMigration/run.py 2>&1 | tee "$RUNNER_TEMP/migration-regression.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snippet-fix-build-regression
          path: |
            ${{ runner.temp }}/swift-regression.log
            ${{ runner.temp }}/migration-regression.log
          retention-days: 14
