name: Isolated macOS GUI capability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Probe isolated runner GUI capabilities
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/gui-probe.swift" <<'SWIFT'
          import AppKit
          import ApplicationServices
          import CoreGraphics
          import Foundation

          let session = CGSessionCopyCurrentDictionary() as? [String: Any] ?? [:]
          print("GUI_SESSION_PRESENT=\(!session.isEmpty)")
          print("GUI_SESSION_ON_CONSOLE=\(session[\"kCGSSessionOnConsoleKey\"] as? Bool ?? false)")
          print("ACCESSIBILITY_TRUSTED=\(AXIsProcessTrusted())")
          print("SCREEN_CAPTURE_ALLOWED=\(CGPreflightScreenCaptureAccess())")
          print("EVENT_POST_ALLOWED=\(CGPreflightPostEventAccess())")
          let application = NSApplication.shared
          application.setActivationPolicy(.regular)
          let window = NSWindow(contentRect: NSRect(x: 100, y: 100, width: 320, height: 200),
                                styleMask: [.titled, .closable], backing: .buffered, defer: false)
          window.title = "Synthetic GUI capability probe"
          window.orderFront(nil)
          application.activate(ignoringOtherApps: true)
          RunLoop.current.run(until: Date(timeIntervalSinceNow: 1))
          print("SYNTHETIC_WINDOW_NUMBER_VALID=\(window.windowNumber > 0)")
          print("SYNTHETIC_WINDOW_VISIBLE=\(window.isVisible)")
          window.close()
          print("PRODUCT_E2E=NOT_RUN")
          SWIFT
          swiftc "$RUNNER_TEMP/gui-probe.swift" -o "$RUNNER_TEMP/gui-probe"
          "$RUNNER_TEMP/gui-probe"
