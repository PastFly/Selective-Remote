name: Isolated candidate GUI launch smoke
on:
  workflow_dispatch:
    inputs:
      build:
        description: Image to launch
        type: choice
        required: true
        options: [baseline, candidate, upgrade, ci-gaps]
        default: candidate
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: ${{ inputs.build != 'ci-gaps' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Fetch exact candidate artifact and check provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND: ${{ inputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence"
          if [[ "$BUILD_KIND" == baseline || "$BUILD_KIND" == upgrade ]]; then
            gh release download v0.31.0 --repo PastFly/Selective-Remote --pattern 'SelectiveRemote-0.31.0-arm64.dmg*' --dir "$RUNNER_TEMP/candidate"
            cd "$RUNNER_TEMP/candidate"
            printf '%s  %s\n' '1aeb31f5992216ac8aed3109b509c3fda78941adeef6142fbefbbeba1181a37f' 'SelectiveRemote-0.31.0-arm64.dmg' | shasum -a 256 -c -
          elif [[ "$BUILD_KIND" == candidate ]]; then
            expected=ddf78d436e135a75eb758bab3505e16e70c4133d
            actual=$(gh api repos/PastFly/Selective-Remote/actions/runs/41620141542 --jq 'select(.status == "completed" and .conclusion == "success") | .head_sha')
            test "$actual" = "$expected"
            gh run download 41620141542 --repo PastFly/Selective-Remote --name SelectiveRemote-test-229-arm64 --dir "$RUNNER_TEMP/candidate"
            cd "$RUNNER_TEMP/candidate"
          else
            exit 1
          fi
          shopt -s nullglob
          images=(*.dmg); hashes=(*.dmg.sha256)
          test "${#images[@]}" -eq 1 && test "${#hashes[@]}" -eq 1
          shasum -a 256 -c "${hashes[0]}"
          shasum -a 256 "${images[0]}" | tee "$RUNNER_TEMP/evidence/image-sha256.txt"
          if [[ "$BUILD_KIND" == upgrade ]]; then
            expected=ddf78d436e135a75eb758bab3505e16e70c4133d
            actual=$(gh api repos/PastFly/Selective-Remote/actions/runs/41620141542 --jq 'select(.status == "completed" and .conclusion == "success") | .head_sha')
            test "$actual" = "$expected"
            mkdir "$RUNNER_TEMP/upgrade-image"
            gh run download 41620141542 --repo PastFly/Selective-Remote --name SelectiveRemote-test-229-arm64 --dir "$RUNNER_TEMP/upgrade-image"
            cd "$RUNNER_TEMP/upgrade-image"
            images=(*.dmg); hashes=(*.dmg.sha256)
            test "${#images[@]}" -eq 1 && test "${#hashes[@]}" -eq 1
            shasum -a 256 -c "${hashes[0]}"
            shasum -a 256 "${images[0]}" | tee "$RUNNER_TEMP/evidence/upgrade-image-sha256.txt"
          fi
      - name: Launch actual app in the disposable runner
        env:
          SR_BUILD_KIND: ${{ inputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          run_build="$SR_BUILD_KIND"
          if [[ "$run_build" == upgrade ]]; then export SR_BUILD_KIND=baseline; fi
          images=("$RUNNER_TEMP"/candidate/*.dmg)
          mount="$RUNNER_TEMP/candidate-mount"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}" > "$RUNNER_TEMP/evidence/mount.log"
          app="$mount/Selective Remote.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/evidence/codesign.log"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          binary="$app/Contents/MacOS/$executable"
          test -x "$binary"
          shasum -a 256 "$binary" | tee "$RUNNER_TEMP/evidence/executable-sha256.txt"
          cleanup() {
            if test -n "${app_pid:-}"; then
              ps -p "$app_pid" -o pid=,ppid=,state=,comm= > "$RUNNER_TEMP/evidence/cleanup-process.txt" 2>&1 || true
              screencapture -x "$RUNNER_TEMP/evidence/cleanup-screen.png" || true
              kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true
            fi
            hdiutil detach "$mount" >> "$RUNNER_TEMP/evidence/mount.log" 2>&1 || true
          }
          trap cleanup EXIT
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/app.log" 2>&1 &
          app_pid=$!
          sleep 12
          kill -0 "$app_pid"
          swiftc scripts/isolated-gui-smoke/keyboard-tests/main.swift scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/keyboard-tests"
          "$RUNNER_TEMP/keyboard-tests"
          python3 -m unittest discover -s scripts/isolated-gui-smoke/keyboard-tests -p 'test_*.py' -v
          cp scripts/isolated-gui-smoke/probe.swift "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/gui-app-probe"
          SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$(shasum -a 256 "$binary" | cut -d " " -f 1)" "$RUNNER_TEMP/gui-app-probe" "$app_pid" | tee "$RUNNER_TEMP/evidence/probe.log"
          screencapture -x "$RUNNER_TEMP/evidence/synthetic-app-screen.png"
          SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$(shasum -a 256 "$binary" | cut -d " " -f 1)" "$RUNNER_TEMP/gui-app-probe" "$app_pid" --terminate | tee "$RUNNER_TEMP/evidence/termination.log"
          wait "$app_pid" || true
          app_pid=""
          if [[ "$SR_BUILD_KIND" == baseline ]]; then
            bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
            defaults export "$bundle" "$RUNNER_TEMP/first.plist"
            sleep 1
            defaults export "$bundle" "$RUNNER_TEMP/second.plist"
            python3 scripts/isolated-gui-smoke/verify-baseline.py "$RUNNER_TEMP/first.plist" "$RUNNER_TEMP/second.plist" | tee "$RUNNER_TEMP/evidence/baseline-persistence.json"
            sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/app-restart.log" 2>&1 &
            app_pid=$!
            sleep 12
            kill -0 "$app_pid"
            SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$(shasum -a 256 "$binary" | cut -d " " -f 1)" "$RUNNER_TEMP/gui-app-probe" "$app_pid" --verify-baseline | tee "$RUNNER_TEMP/evidence/restart-ui.log"
            screencapture -x "$RUNNER_TEMP/evidence/baseline-reopened.png"
            SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$(shasum -a 256 "$binary" | cut -d " " -f 1)" "$RUNNER_TEMP/gui-app-probe" "$app_pid" --terminate | tee "$RUNNER_TEMP/evidence/restart-termination.log"
            wait "$app_pid" || true
            app_pid=""
            defaults export "$bundle" "$RUNNER_TEMP/after-restart.plist"
            python3 scripts/isolated-gui-smoke/verify-baseline.py "$RUNNER_TEMP/first.plist" "$RUNNER_TEMP/after-restart.plist" | tee "$RUNNER_TEMP/evidence/restart-persistence.json"
            if [[ "$run_build" == upgrade ]]; then
              hdiutil detach "$mount" >> "$RUNNER_TEMP/evidence/mount.log" 2>&1
              upgraded_images=("$RUNNER_TEMP"/upgrade-image/*.dmg)
              test "${#upgraded_images[@]}" -eq 1
              hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${upgraded_images[0]}" >> "$RUNNER_TEMP/evidence/mount.log"
              test -d "$app"
              codesign --verify --deep --strict "$app"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$bundle"
              executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
              binary="$app/Contents/MacOS/$executable"
              shasum -a 256 "$binary" | tee "$RUNNER_TEMP/evidence/upgrade-executable-sha256.txt"
              export SR_BUILD_KIND=candidate
              sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/app-upgrade.log" 2>&1 &
              app_pid=$!
              sleep 12
              kill -0 "$app_pid"
              SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$(shasum -a 256 "$binary" | cut -d " " -f 1)" "$RUNNER_TEMP/gui-app-probe" "$app_pid" --inspect-upgrade | tee "$RUNNER_TEMP/evidence/upgrade-ui.log"
              screencapture -x "$RUNNER_TEMP/evidence/upgrade-screen.png"
              SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$(shasum -a 256 "$binary" | cut -d " " -f 1)" "$RUNNER_TEMP/gui-app-probe" "$app_pid" --terminate | tee "$RUNNER_TEMP/evidence/upgrade-termination.log"
              wait "$app_pid" || true
              app_pid=""
              defaults export "$bundle" "$RUNNER_TEMP/upgraded.plist"
              python3 scripts/isolated-gui-smoke/verify-upgrade.py "$RUNNER_TEMP/first.plist" "$RUNNER_TEMP/upgraded.plist" | tee "$RUNNER_TEMP/evidence/upgrade-persistence.json"
            fi
          fi
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-candidate-gui-smoke
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
  skipped-v1-and-browser:
    if: ${{ inputs.build == 'ci-gaps' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
        env:
          POSTGRES_DB: selective_remote_test
          POSTGRES_USER: selective_remote_test
          POSTGRES_PASSWORD: integration-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U selective_remote_test -d selective_remote_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4d3153d41bde955dcfe13b8f0ac8a5b28e15a692
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - working-directory: cloud
        run: npm ci
      - name: Exercise skipped V1 and browser cases
        working-directory: cloud
        env:
          TEST_DATABASE_URL: postgres://selective_remote_test:integration-only-password@127.0.0.1:5432/selective_remote_test
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" CHROMIUM_PATH="$browser" \
            node --test --test-concurrency=1 tests/v1-startup-fence-required.test.mjs tests/v1-team-lost-commit.test.mjs tests/public-mobile-locale-browser.test.mjs tests/whole-publication-browser-postgres.test.mjs
