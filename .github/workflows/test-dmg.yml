name: Isolated controller rollback acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Verify and exercise separately installed controller in ephemeral VM
        run: sudo --preserve-env=GITHUB_WORKSPACE,PATH bash "$GITHUB_WORKSPACE/scripts/isolated-controller-acceptance/run.sh"
      - name: Upload sanitized acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-controller-acceptance
          path: /tmp/sr-controller-acceptance/results/
          if-no-files-found: warn
