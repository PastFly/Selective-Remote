name: Exact DMG synthetic Keychain credential matrix
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  warning:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Download verified images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/PastFly/Selective-Remote/actions/runs/41737602354 --jq 'select(.status == "completed" and .conclusion == "success") | .head_sha')" = db7c5920a85c74e2008166298d2ac80cab66f857
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" "$RUNNER_TEMP/evidence"
          gh release download v0.31.0 --repo PastFly/Selective-Remote --pattern 'SelectiveRemote-0.31.0-arm64.dmg*' --dir "$RUNNER_TEMP/old"
          (cd "$RUNNER_TEMP/old"; echo '1aeb31f5992216ac8aed3109b509c3fda78941adeef6142fbefbbeba1181a37f  SelectiveRemote-0.31.0-arm64.dmg' | shasum -a 256 -c -)
          gh run download 41737602354 --repo PastFly/Selective-Remote --name SelectiveRemote-test-229-arm64 --dir "$RUNNER_TEMP/new"
          (cd "$RUNNER_TEMP/new"; shasum -a 256 -c ./*.dmg.sha256; shasum -a 256 ./*.dmg | tee "$RUNNER_TEMP/evidence/exact-dmg-sha256.txt")
      - name: Exercise real legacy edit and warning
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true && test "${RUNNER_ENVIRONMENT:-}" = github-hosted && test "${USER:-}" = runner
          shopt -s nullglob
          keychain="$RUNNER_TEMP/selective-remote-synthetic.keychain-db"
          original_default=$(security default-keychain -d user | python3 -c 'import shlex,sys; a=shlex.split(sys.stdin.read()); print(a[0] if a else "")')
          original_keychains=()
          while IFS= read -r item; do original_keychains+=("$item"); done < <(security list-keychains -d user | python3 -c 'import shlex,sys; print("\n".join(shlex.split(sys.stdin.read())))')
          cleanup() {
            result=$?
            python3 scripts/isolated-gui-smoke/save-synthetic-snapshots.py "$RUNNER_TEMP" "$RUNNER_TEMP/evidence" || true
            if [[ "$result" -ne 0 ]]; then screencapture -x "$RUNNER_TEMP/evidence/failure.png" || true; fi
            for pid in "${app_pid:-}" "${app_pid2:-}"; do if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; done
            hdiutil detach "$RUNNER_TEMP/candidate-mount2" >/dev/null 2>&1 || true
            hdiutil detach "$RUNNER_TEMP/candidate-mount" >/dev/null 2>&1 || true
            if [[ -n "$original_default" ]]; then security default-keychain -d user -s "$original_default" || true; fi
            if [[ "${#original_keychains[@]}" -gt 0 ]]; then security list-keychains -d user -s "${original_keychains[@]}" || true; fi
            security delete-keychain "$keychain" || true
            rm -f "$RUNNER_TEMP/synthetic-keychain-password"
          }
          trap cleanup EXIT
          password=$(openssl rand -hex 24); umask 077; printf '%s' "$password" > "$RUNNER_TEMP/synthetic-keychain-password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          mkdir "$RUNNER_TEMP/candidate-mount" "$RUNNER_TEMP/candidate-mount2"
          old=("$RUNNER_TEMP"/old/*.dmg); new=("$RUNNER_TEMP"/new/*.dmg)
          test "${#old[@]}" -eq 1 && test "${#new[@]}" -eq 1
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/candidate-mount2" "${old[0]}" >/dev/null
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/candidate-mount" "${new[0]}" >/dev/null
          app="$RUNNER_TEMP/candidate-mount2/Selective Remote.app"; app2="$RUNNER_TEMP/candidate-mount/Selective Remote.app"
          codesign --verify --deep --strict "$app" && codesign --verify --deep --strict "$app2"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$bundle" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app2/Contents/Info.plist")"
          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          binary2="$app2/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app2/Contents/Info.plist")"
          hash=$(shasum -a 256 "$binary" | cut -d ' ' -f 1); hash2=$(shasum -a 256 "$binary2" | cut -d ' ' -f 1)
          cp scripts/isolated-gui-smoke/probe.swift "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/gui-probe"
          cp scripts/isolated-gui-smoke/SecurityPrompt.swift "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" scripts/isolated-gui-smoke/KeyboardMap.swift -o "$RUNNER_TEMP/security-prompt"
          swiftc scripts/isolated-gui-smoke/warning-observe.swift -o "$RUNNER_TEMP/warning-observe"
          swiftc scripts/isolated-gui-smoke/CredentialMatrix.swift -o "$RUNNER_TEMP/keychain-probe"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary" > "$RUNNER_TEMP/evidence/old-initial.log" 2>&1 & app_pid=$!
          sleep 12; kill -0 "$app_pid"
          SR_BUILD_KIND=baseline SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" python3 scripts/isolated-gui-smoke/run-bounded.py 100 "$RUNNER_TEMP/gui-probe" "$app_pid" > "$RUNNER_TEMP/evidence/old-create.log"
          SR_EXPECTED_EXECUTABLE="$binary" SR_EXPECTED_HASH="$hash" "$RUNNER_TEMP/gui-probe" "$app_pid" --terminate
          wait "$app_pid" || true; app_pid=""
          defaults export "$bundle" "$RUNNER_TEMP/before-migration.plist"
          python3 scripts/isolated-gui-smoke/verify-baseline.py "$RUNNER_TEMP/before-migration.plist" "$RUNNER_TEMP/before-migration.plist" > "$RUNNER_TEMP/evidence/baseline-persistence.json"
          matrix_probe() {
            local action="$1" version="$2" log="$3"
            python3 scripts/isolated-gui-smoke/run-bounded.py 70 "$RUNNER_TEMP/keychain-probe" "$action" "$version" "$RUNNER_TEMP/evidence/baseline-persistence.json" > "$log" 2>&1 & local probe_pid=$!
            python3 scripts/isolated-gui-smoke/run-bounded.py 25 "$RUNNER_TEMP/security-prompt" "$RUNNER_TEMP/synthetic-keychain-password" "$probe_pid" "$version" probe > "$RUNNER_TEMP/evidence/$action-$version-prompt.log"
            if kill -0 "$probe_pid" 2>/dev/null; then
              python3 scripts/isolated-gui-smoke/run-bounded.py 25 "$RUNNER_TEMP/security-prompt" "$RUNNER_TEMP/synthetic-keychain-password" "$probe_pid" "$version" probe >> "$RUNNER_TEMP/evidence/$action-$version-prompt.log" || true
            fi
            wait "$probe_pid"; cat "$log"
          }
          matrix_probe seed 031 "$RUNNER_TEMP/evidence/matrix-seed.log"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$binary2" > "$RUNNER_TEMP/evidence/new.log" 2>&1 & app_pid2=$!
          SR_EXPECTED_EXECUTABLE="$binary2" SR_EXPECTED_HASH="$hash2" python3 scripts/isolated-gui-smoke/run-bounded.py 25 "$RUNNER_TEMP/security-prompt" "$RUNNER_TEMP/synthetic-keychain-password" "$app_pid2" 031 candidate > "$RUNNER_TEMP/evidence/migration-prompt.log"
          sleep 12; kill -0 "$app_pid2"
          "$RUNNER_TEMP/warning-observe" "$app_pid2" '' ready
          SR_EXPECTED_EXECUTABLE="$binary2" SR_EXPECTED_HASH="$hash2" "$RUNNER_TEMP/gui-probe" "$app_pid2" --terminate
          wait "$app_pid2" || true; app_pid2=""
          defaults export "$bundle" "$RUNNER_TEMP/migrated.plist"
          python3 scripts/isolated-gui-smoke/verify-upgrade.py "$RUNNER_TEMP/before-migration.plist" "$RUNNER_TEMP/migrated.plist" > "$RUNNER_TEMP/evidence/migration.json"
          matrix_probe verify 031 "$RUNNER_TEMP/evidence/matrix-old.log"
          matrix_probe verify 032 "$RUNNER_TEMP/evidence/matrix-new.log"
          echo 'SYNTHETIC_FIVE_CREDENTIAL_KINDS_MIGRATED=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-exact-credential-matrix
          path: ${{ runner.temp }}/evidence
          retention-days: 7
