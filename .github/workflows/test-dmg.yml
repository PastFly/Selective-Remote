name: Exact candidate macOS 14 Test DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg14:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SELECTIVEREMOTE_UPDATE_FEED_URL: https://raw.githubusercontent.com/PastFly/Selective-Remote/main/Resources/updates.json
      SELECTIVEREMOTE_RELEASE_MODE: community
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f43ad5755aa9bb315860cb99bdc4cbfaceda927c
      - name: Verify source and build environment
        run: |
          test "$(git rev-parse HEAD)" = f43ad5755aa9bb315860cb99bdc4cbfaceda927c
          swift --version
          swift --version | grep -E 'Swift version 6\.'
      - name: Install build dependencies
        run: brew install freerdp sdl3
      - name: Build test DMG
        run: ./scripts/build_app.sh
      - name: Verify packaged managed Jump Host transport
        run: python3 Tests/SSHPasswordE2E/run_managed_transport.py "dist/Selective Remote.app/Contents/Helpers/SelectiveRemoteSSHProxy"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-f43-macos14-test-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
