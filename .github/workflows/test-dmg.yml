name: Isolated OpenSSH Keychain passphrase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openssh:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Exercise synthetic encrypted key with disposable agent and Keychain
        run: python3 scripts/isolated-openssh-passphrase/matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-openssh-keychain-passphrase
          path: ${{ runner.temp }}/evidence
          retention-days: 14
