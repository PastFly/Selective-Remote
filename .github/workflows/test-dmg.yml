name: Synthetic Keychain credential matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fault:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile exact vault source for six synthetic credential types
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true && test "${RUNNER_ENVIRONMENT:-}" = github-hosted && test "${USER:-}" = runner
          mkdir -p "$RUNNER_TEMP/evidence"
          shasum -a 256 Sources/SelectiveRemote/UnifiedCredentialVault.swift > "$RUNNER_TEMP/evidence/source-sha256.txt"
          swiftc Sources/SelectiveRemote/UnifiedCredentialVault.swift scripts/isolated-keychain-boundaries/main.swift -o "$RUNNER_TEMP/keychain-probe"
      - name: Migrate, restart and delete six credential types
        env:
          SR_KEYCHAIN_FAULT_ROOT: ${{ runner.temp }}/keychain-write-boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/isolated-keychain-boundaries/supervise.py "$RUNNER_TEMP/keychain-probe" "$RUNNER_TEMP/evidence" | tee "$RUNNER_TEMP/evidence/boundaries.log"
      - name: Capture failure screenshot
        if: failure()
        run: screencapture -x "$RUNNER_TEMP/evidence/failure.png" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-keychain-six-type-matrix
          path: ${{ runner.temp }}/evidence
          retention-days: 14
