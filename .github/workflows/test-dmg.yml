name: Targeted mobile browser CI diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Install checked-in dependencies
        working-directory: cloud
        run: npm ci
      - name: Run unchanged mobile tests in default mode
        continue-on-error: true
        working-directory: cloud
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" CHROMIUM_PATH="$browser" node --test tests/workspace-mobile-sync-status-browser.test.mjs tests/public-mobile-locale-browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/parallel.log"
      - name: Run unchanged mobile tests serially
        working-directory: cloud
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" CHROMIUM_PATH="$browser" node --test --test-concurrency=1 tests/workspace-mobile-sync-status-browser.test.mjs tests/public-mobile-locale-browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/serial.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ci-timeout-diagnosis
          path: ${{ runner.temp }}/evidence
          retention-days: 14
