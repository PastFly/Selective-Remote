name: Test DMG

on:
  push:
    branches: ["work/v0.23.0-polish"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 test DMG
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SELECTIVEREMOTE_UPDATE_FEED_URL: https://raw.githubusercontent.com/PastFly/Selective-Remote/main/Resources/updates.json
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6

      - name: Select Swift 6 toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Install build dependencies
        run: brew install freerdp sdl3

      - name: Test candidate
        run: |
          swift test
          node --test Tests/TerminalResourcesTests/*.test.js

      - name: Build ad-hoc signed DMG
        run: ./scripts/build_app.sh

      - name: Upload test DMG
        uses: actions/upload-artifact@v6
        with:
          name: SelectiveRemote-0.23.0-test-${{ github.run_number }}
          path: |
            dist/SelectiveRemote-0.23.0-arm64.dmg
            dist/SelectiveRemote-0.23.0-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
