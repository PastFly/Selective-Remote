name: Pre-release cleanup validator

on:
  push:
    branches: [agent/sftp-lifecycle-0.22.2]

permissions:
  contents: write

jobs:
  cleanup-test-commit:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/sftp-lifecycle-0.22.2
          fetch-depth: 0

      - name: Apply pre-release cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # AppModel: remove the superseded single-session SFTP runtime and observers.
          path = Path("Sources/SelectiveRemote/AppModel.swift")
          text = path.read_text()
          text = replace_once(
              text,
              "    let sftpSession = SFTPBrowserSession()\n    let globalSFTPSession = SFTPBrowserSession()\n",
              "",
              "legacy AppModel SFTP sessions",
          )
          text = replace_once(
              text,
              "    private var sftpObservers: [AnyCancellable] = []\n",
              "",
              "legacy SFTP observers property",
          )
          text = replace_once(
              text,
              '''        sftpObservers = [
              sftpSession.objectWillChange.sink { [weak self] _ in
                  Task { @MainActor [weak self] in
                      self?.objectWillChange.send()
                  }
              },
              globalSFTPSession.objectWillChange.sink { [weak self] _ in
                  Task { @MainActor [weak self] in
                      self?.objectWillChange.send()
                  }
              }
          ]
          ''',
              "",
              "legacy SFTP observer wiring",
          )
          text = replace_once(
              text,
              '''        case let .sftp(scope):
              switch scope {
              case let .pane(paneID):
                  guard let pane = sftpWorkspace.pane(id: paneID),
                        let settings = pane.session.settings else { return }
                  pane.session.disconnect()
                  pane.session.connect(settings)
              case .profile, .global:
                  break
              }
          ''',
              '''        case let .sftp(.pane(paneID)):
              guard let pane = sftpWorkspace.pane(id: paneID),
                    let settings = pane.session.settings else { return }
              pane.session.disconnect()
              pane.session.connect(settings)
          ''',
              "Connection Center SFTP reconnect scope",
          )
          text = replace_once(
              text,
              '''        case let .sftp(scope):
              switch scope {
              case let .pane(paneID):
                  sftpWorkspace.pane(id: paneID)?.clear()
              case let .profile(profileID):
                  if sftpSession.profileID == profileID {
                      sftpSession.disconnect()
                  }
              case .global:
                  globalSFTPSession.disconnect()
              }
          ''',
              '''        case let .sftp(.pane(paneID)):
              sftpWorkspace.pane(id: paneID)?.clear()
          ''',
              "Connection Center SFTP disconnect scope",
          )
          path.write_text(text)

          # Connection Center: only real Workspace panes can now be SFTP sources.
          path = Path("Sources/SelectiveRemote/ConnectionCenter.swift")
          text = path.read_text()
          text = replace_once(
              text,
              '''enum ConnectionCenterSFTPScope: Hashable {
              case pane(UUID)
              case profile(UUID)
              case global
          }
          ''',
              '''enum ConnectionCenterSFTPScope: Hashable {
              case pane(UUID)
          }
          ''',
              "legacy SFTP source cases",
          )
          text = replace_once(
              text,
              '''        case let .sftp(scope):
              switch scope {
              case let .pane(paneID):
                  "sftp:pane:\\(paneID.uuidString)"
              case let .profile(profileID):
                  "sftp:profile:\\(profileID.uuidString)"
              case .global:
                  "sftp:global"
              }
          ''',
              '''        case let .sftp(.pane(paneID)):
              "sftp:pane:\\(paneID.uuidString)"
          ''',
              "legacy SFTP stable IDs",
          )
          path.write_text(text)

          # ContentView: remove unreachable legacy global-SFTP sheet/runtime and normalize pane routing.
          path = Path("Sources/SelectiveRemote/ContentView.swift")
          text = path.read_text()
          text = replace_once(
              text,
              '''    private static let globalSFTPScopeID = UUID(
              uuidString: "9C99721B-CFF3-48B7-A0A4-22E627A7D56C"
          )!

          ''',
              "",
              "legacy global SFTP scope ID",
          )
          text = replace_once(
              text,
              "    @State private var showsGlobalSFTPConnectionEditor = false\n    @State private var globalSFTPConnection: TerminalTabConnection?\n",
              "",
              "legacy global SFTP state",
          )
          text = replace_once(
              text,
              '''        .sheet(isPresented: $showsGlobalSFTPConnectionEditor) {
              TerminalConnectionEditor(
                  profiles: sortedSSHProfiles,
                  initialConnection: globalSFTPConnection
                      ?? sortedSSHProfiles.first.map {
                          .savedProfile($0.id)
                      }
                      ?? .custom(host: "", username: ""),
                  allowsInteractivePassword: true,
                  actionTitle: "Подключить SFTP",
                  heading: "Подключение SFTP",
                  message: "Выберите сохранённый сервер или укажите временный SFTP-адрес. "
                      + "При необходимости пароль будет запрошен отдельным системным окном.",
                  customAuthenticationMessage: "SFTP использует системный ssh-agent и ~/.ssh/config. "
                      + "Если ключа или активной SSH-сессии нет, пароль будет запрошен "
                      + "в отдельном защищённом окне и не будет сохранён.",
                  onSave: { connection, _, temporaryPassword in
                      globalSFTPConnection = connection
                      connectGlobalSFTP(connection, temporaryPassword: temporaryPassword)
                  }
              )
          }
          ''',
              "",
              "legacy global SFTP sheet",
          )
          text = replace_once(
              text,
              '''    private var globalSFTPProfile: ConnectionProfile {
              var profile = ConnectionProfile(connectionType: .ssh)
              profile.id = Self.globalSFTPScopeID
              profile.friendlyName = "SFTP"
              return profile
          }

              private func connectGlobalSFTP(
              _ connection: TerminalTabConnection,
              clientID: UUID = Self.globalSFTPScopeID,
              temporaryPassword: String? = nil
          ) {
              guard let settings = model.prepareSSHConnection(
                  connection: connection,
                  clientID: clientID
              ) else { return }

              let hasTemporaryPassword = connection.kind == .custom
                  && temporaryPassword?.isEmpty == false
              if hasTemporaryPassword, let temporaryPassword {
                  do {
                      try KeychainService.savePassword(
                          temporaryPassword,
                          profileID: clientID,
                          kind: .ssh
                      )
                  } catch {
                      model.errorMessage = error.localizedDescription
                      return
                  }
              }

              model.globalSFTPSession.prepare(for: Self.globalSFTPScopeID)
              model.globalSFTPSession.connect(settings) { _ in
                  if hasTemporaryPassword {
                      try? KeychainService.deletePassword(profileID: clientID, kind: .ssh)
                  }
              }
          }

          ''',
              "",
              "legacy global SFTP helpers",
          )
          text = replace_once(
              text,
              '''        case let .sftp(scope):
              switch scope {
    case let .pane(paneID):
      if let tab = model.sftpWorkspace.tab(containing: paneID) {
          model.sftpWorkspace.selectedTabID = tab.id
      }
      setMainArea(.sftp)
              case let .profile(profileID):
                  model.selectProfile(profileID)
                  selectedTab = .sftp
                  setMainArea(.connections)
              case .global:
                  setMainArea(.sftp)
              }
          ''',
              '''        case let .sftp(.pane(paneID)):
              if let tab = model.sftpWorkspace.tab(containing: paneID) {
                  model.sftpWorkspace.selectedTabID = tab.id
              }
              setMainArea(.sftp)
          ''',
              "Connection Center SFTP open routing",
          )
          path.write_text(text)

          # SFTPWorkspace: normalize the carrier-generated DnD indentation only.
          path = Path("Sources/SelectiveRemote/SFTPWorkspace.swift")
          text = path.read_text()
          text = replace_once(
              text,
              '''            .onDrop(
        of: sftpWorkspaceDropTypeIdentifiers,
        isTargeted: $dropTargeted
    ) { providers in
        acceptDrops(providers, destination: model.currentDirectory)
    }

          ''',
              '''            .onDrop(
                  of: sftpWorkspaceDropTypeIdentifiers,
                  isTargeted: $dropTargeted
              ) { providers in
                  acceptDrops(providers, destination: model.currentDirectory)
              }

          ''',
              "local pane drop formatting",
          )
          text = replace_once(
              text,
              '''        let stringProviders = providers.filter {
    $0.hasItemConformingToTypeIdentifier(
        NSPasteboard.PasteboardType.string.rawValue
    )
          }
          if !stringProviders.isEmpty {
    for provider in stringProviders {
        provider.loadDataRepresentation(
            forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue
        ) { data, _ in
            guard let data,
                  let value = String(data: data, encoding: .utf8)
            else { return }
            Task { @MainActor in
                _ = acceptInternalRemoteDrag(
                    [value],
                    destination: destination
                )
            }
        }
    }
    return true
          }
          ''',
              '''        let stringProviders = providers.filter {
              $0.hasItemConformingToTypeIdentifier(
                  NSPasteboard.PasteboardType.string.rawValue
              )
          }
          if !stringProviders.isEmpty {
              for provider in stringProviders {
                  provider.loadDataRepresentation(
                      forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue
                  ) { data, _ in
                      guard let data,
                            let value = String(data: data, encoding: .utf8)
                      else { return }
                      Task { @MainActor in
                          _ = acceptInternalRemoteDrag(
                              [value],
                              destination: destination
                          )
                      }
                  }
              }
              return true
          }
          ''',
              "local internal drop formatting",
          )
          text = replace_once(
              text,
              '''                .onDrop(
            of: sftpWorkspaceDropTypeIdentifiers,
            isTargeted: $dropTargeted
        ) { providers in
            acceptDrops(
                providers,
                to: remote.currentPath,
                destinationSettings: settings
            )
        }

          ''',
              '''                .onDrop(
                    of: sftpWorkspaceDropTypeIdentifiers,
                    isTargeted: $dropTargeted
                ) { providers in
                    acceptDrops(
                        providers,
                        to: remote.currentPath,
                        destinationSettings: settings
                    )
                }

          ''',
              "remote pane drop formatting",
          )
          text = replace_once(
              text,
              '''        let fileProviders = providers.filter {
    $0.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier)
          }
          if !fileProviders.isEmpty {
    for provider in fileProviders {
        provider.loadObject(ofClass: NSURL.self) { object, _ in
            guard let nsURL = object as? NSURL else { return }
            let url = nsURL as URL
            Task { @MainActor in
                remote.upload(
                    localURLs: [url],
                    to: destinationDirectory,
                    settings: destinationSettings
                )
            }
        }
    }
    return true
          }

          let stringProviders = providers.filter {
    $0.hasItemConformingToTypeIdentifier(
        NSPasteboard.PasteboardType.string.rawValue
    )
          }
          guard !stringProviders.isEmpty else { return false }
          for provider in stringProviders {
    provider.loadDataRepresentation(
        forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue
    ) { data, _ in
        guard let data,
              let value = String(data: data, encoding: .utf8)
        else { return }
        Task { @MainActor in
            _ = acceptInternalRemoteDrag(
                [value],
                to: destinationDirectory,
                destinationSettings: destinationSettings
            )
        }
    }
          }
          return true

          ''',
              '''        let fileProviders = providers.filter {
              $0.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier)
          }
          if !fileProviders.isEmpty {
              for provider in fileProviders {
                  provider.loadObject(ofClass: NSURL.self) { object, _ in
                      guard let nsURL = object as? NSURL else { return }
                      let url = nsURL as URL
                      Task { @MainActor in
                          remote.upload(
                              localURLs: [url],
                              to: destinationDirectory,
                              settings: destinationSettings
                          )
                      }
                  }
              }
              return true
          }

          let stringProviders = providers.filter {
              $0.hasItemConformingToTypeIdentifier(
                  NSPasteboard.PasteboardType.string.rawValue
              )
          }
          guard !stringProviders.isEmpty else { return false }
          for provider in stringProviders {
              provider.loadDataRepresentation(
                  forTypeIdentifier: NSPasteboard.PasteboardType.string.rawValue
              ) { data, _ in
                  guard let data,
                        let value = String(data: data, encoding: .utf8)
                  else { return }
                  Task { @MainActor in
                      _ = acceptInternalRemoteDrag(
                          [value],
                          to: destinationDirectory,
                          destinationSettings: destinationSettings
                      )
                  }
              }
          }
          return true

          ''',
              "remote acceptDrops formatting",
          )
          path.write_text(text)

          # Regression: the superseded SFTP runtime must stay gone.
          path = Path("Tests/SelectiveRemoteTests/SFTPLifecycleRegressionTests.swift")
          text = path.read_text()
          text = replace_once(
              text,
              '#expect(source.contains("case let .sftp(scope):"))',
              '#expect(source.contains("case let .sftp(.pane(paneID)):"))',
              "managed pane reconnect regression",
          )
          marker = '''

          @Test("Legacy single-session SFTP runtime stays removed")
          func legacySingleSessionSFTPRuntimeStaysRemoved() throws {
              let root = URL(fileURLWithPath: #filePath)
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
              let appModel = try String(
                  contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/AppModel.swift"),
                  encoding: .utf8
              )
              let content = try String(
                  contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/ContentView.swift"),
                  encoding: .utf8
              )
              let center = try String(
                  contentsOf: root.appendingPathComponent("Sources/SelectiveRemote/ConnectionCenter.swift"),
                  encoding: .utf8
              )
              #expect(!appModel.contains("let sftpSession = SFTPBrowserSession()"))
              #expect(!appModel.contains("globalSFTPSession"))
              #expect(!appModel.contains("sftpObservers"))
              #expect(!content.contains("showsGlobalSFTPConnectionEditor"))
              #expect(!content.contains("globalSFTPScopeID"))
              #expect(!center.contains("sftp:profile:"))
              #expect(!center.contains("sftp:global"))
          }
          '''
          marker = "\n".join(line[10:] if line.startswith("          ") else line for line in marker.splitlines())
          if "Legacy single-session SFTP runtime stays removed" in text:
              raise SystemExit("legacy cleanup regression already exists")
          path.write_text(text.rstrip() + marker + "\n")

          # Clean up indentation in the recently added source-contract tests.
          path = Path("Tests/SelectiveRemoteTests/SFTPWorkspaceSmartLinksTests.swift")
          text = path.read_text().replace(
              "contentsOf: projectRoot\n  .appendingPathComponent",
              "contentsOf: projectRoot\n            .appendingPathComponent",
          )
          path.write_text(text)

          # Release workflow must require an explicit tag instead of suggesting an obsolete one.
          path = Path(".github/workflows/release.yml")
          text = path.read_text()
          text = replace_once(
              text,
              "        default: v0.20.6\n",
              "",
              "stale release tag default",
          )
          path.write_text(text)

          # Hard assertions before compiling.
          app = Path("Sources/SelectiveRemote/AppModel.swift").read_text()
          content = Path("Sources/SelectiveRemote/ContentView.swift").read_text()
          center = Path("Sources/SelectiveRemote/ConnectionCenter.swift").read_text()
          release = Path(".github/workflows/release.yml").read_text()
          for forbidden in ["let sftpSession = SFTPBrowserSession()", "globalSFTPSession", "sftpObservers"]:
              if forbidden in app:
                  raise SystemExit(f"legacy AppModel SFTP token remains: {forbidden}")
          for forbidden in ["showsGlobalSFTPConnectionEditor", "globalSFTPScopeID", "connectGlobalSFTP"]:
              if forbidden in content:
                  raise SystemExit(f"legacy ContentView SFTP token remains: {forbidden}")
          if "sftp:profile:" in center or "sftp:global" in center:
              raise SystemExit("legacy Connection Center SFTP scope remains")
          if "default: v0.20.6" in release:
              raise SystemExit("stale release default remains")
          PY

      - name: Validate diff
        run: git diff --check

      - name: Swift tests
        run: swift test

      - name: Release build
        run: swift build -c release

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pre-release-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests .github/workflows/release.yml .github/workflows/pre-release-cleanup.yml
          git diff --cached --check
          git commit -m "Clean up legacy SFTP runtime before 0.22.2"
          git push origin HEAD:agent/sftp-lifecycle-0.22.2
