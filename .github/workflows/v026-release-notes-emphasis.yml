name: v0.26.0 Release Notes Emphasis

on:
  push:
    branches:
      - feature/v0.26.0-smart-workspaces

permissions:
  contents: write

concurrency:
  group: v026-release-notes-emphasis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-release-notes:
    if: ${{ !contains(github.event.head_commit.message, '[release-notes applied]') }}
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.26.0-smart-workspaces
          fetch-depth: 0

      - name: Apply release-note emphasis
        run: python3 scripts/v026_release_notes_emphasis.py

      - name: Validate release metadata
        run: |
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          build="$(sed -nE 's/^BUILD_NUMBER="([^"]+)"/\1/p' scripts/build_app.sh)"
          test "$version" = "0.26.0"
          test "$build" = "139"
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
          grep -q 'Объединить пароли' "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import json
          with open('Resources/updates.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['version'] == '0.26.0'
          assert data['build'] == 139
          assert data['downloadURL'].endswith('/v0.26.0/SelectiveRemote-0.26.0-arm64.dmg')
          PY

      - name: Remove temporary patch files
        run: |
          git rm -f scripts/v026_release_notes_emphasis.py .github/workflows/v026-release-notes-emphasis.yml

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Emphasize Unified Keychain Vault in v0.26.0 release notes [release-notes applied]"
          git fetch origin feature/v0.26.0-smart-workspaces
          git rebase origin/feature/v0.26.0-smart-workspaces
          git push origin HEAD:feature/v0.26.0-smart-workspaces
