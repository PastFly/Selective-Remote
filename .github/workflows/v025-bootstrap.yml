name: Bootstrap v0.25.0 terminal UX

on:
  push:
    branches:
      - feature/v0.25.0-terminal-ux
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v025-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-publish:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v025 patched]') }}
    runs-on: macos-14
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.25.0-terminal-ux
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/v025_patch.py

      - name: Validate terminal web interactions
        run: node --test Tests/TerminalResourcesTests/*.test.js

      - name: Run Swift tests
        run: swift test

      - name: Validate release build
        run: swift build -c release

      - name: Remove bootstrap files
        run: |
          git rm -- scripts/v025_patch.py .github/workflows/v025-bootstrap.yml

      - name: Commit patched candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Sources/SelectiveRemote/EmbeddedTerminalView.swift \
            Sources/SelectiveRemote/LocalTerminalView.swift \
            Sources/SelectiveRemote/SelectiveRemoteApp.swift \
            Sources/SelectiveRemote/SettingsWindowCloseGuard.swift \
            Sources/SelectiveRemote/TerminalPaneTheme.swift \
            Sources/SelectiveRemote/TerminalResources/terminal.html \
            Sources/SelectiveRemote/TerminalResources/terminal-panel-persistence.js \
            Tests/SelectiveRemoteTests/TerminalUX0250Tests.swift \
            Tests/TerminalResourcesTests/terminal-panel-persistence.test.js \
            Tests/TerminalResourcesTests/terminal-snippet-global.test.js \
            scripts/build_app.sh
          git status --short
          git commit -m "Improve terminal UX for 0.25.0 [v025 patched]"
          git push origin HEAD:feature/v0.25.0-terminal-ux
