name: v0.26.0 Productivity Phase 2

on:
  push:
    branches:
      - feature/v0.26.0-smart-workspaces

permissions:
  contents: write

concurrency:
  group: v026-productivity-phase2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v026-phase2 applied]') }}
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.26.0-smart-workspaces
          fetch-depth: 0

      - name: Apply Startup Snippets, variables and group inheritance
        run: python3 scripts/v026_phase2_patch.py

      - name: Validate shell scripts and release notes
        run: |
          bash -n scripts/build_app.sh
          version=$(grep '^VERSION=' scripts/build_app.sh | head -1 | cut -d'"' -f2)
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Swift tests
        run: swift test

      - name: Terminal browser tests
        run: node --test Tests/TerminalResourcesTests/*.test.js

      - name: Release build
        run: swift build -c release

      - name: Remove bootstrap and restore normal CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch scripts/v026_phase2_patch.py .github/workflows/v026-productivity-phase2.yml

      - name: Commit validated phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Startup Snippets, variables and group inheritance [v026-phase2 applied]"
          git fetch origin feature/v0.26.0-smart-workspaces
          git rebase origin/feature/v0.26.0-smart-workspaces
          git push origin HEAD:feature/v0.26.0-smart-workspaces
