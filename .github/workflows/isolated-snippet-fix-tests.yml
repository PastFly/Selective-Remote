name: Isolated snippet fix tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snippet-fix:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f9a83583c3eb2e674f07d2312025bffe1313966e
      - name: Test exact temporary fix and related snippet suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f9a83583c3eb2e674f07d2312025bffe1313966e
          swift test --filter Snippet
