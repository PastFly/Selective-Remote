name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests on macOS
    runs-on: macos-14
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Validate shell scripts
        run: |
          bash -n scripts/build_app.sh
          bash -n scripts/build_and_install.sh
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Test
        run: swift test

      - name: Test terminal web interactions
        run: node --test Tests/TerminalResourcesTests/*.test.js

      - name: Test Selective Remote Cloud
        working-directory: cloud
        run: |
          npm ci
          npm test

      - name: Release build
        run: swift build -c release
