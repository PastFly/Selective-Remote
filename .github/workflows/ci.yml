name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/v0.26.0-smart-workspaces' }}
    name: Swift tests on macOS
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.26.0-smart-workspaces
          fetch-depth: 0

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Apply v0.26.0 Host Insights layer
        run: python3 scripts/v026_phase1_patch.py

      - name: Validate shell scripts
        run: |
          bash -n scripts/build_app.sh
          bash -n scripts/build_and_install.sh
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Swift tests
        run: swift test

      - name: Test terminal web interactions
        run: node --test Tests/TerminalResourcesTests/*.test.js

      - name: Release build
        run: swift build -c release

      - name: Restore normal CI and remove bootstrap files
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch scripts/v026_phase1_patch.py .github/workflows/v026-productivity-phase1.yml scripts/v026_trigger.txt

      - name: Commit validated phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Host Insights and context-aware terminal autocomplete [v026-phase1 applied]"
          git push origin HEAD:feature/v0.26.0-smart-workspaces
