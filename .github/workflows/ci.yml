name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Finalize 0.22.2 on macOS
    runs-on: macos-14
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Prepare 0.22.2 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"{path}: expected {old!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once('scripts/build_app.sh', 'VERSION="0.22.1"', 'VERSION="0.22.2"')
          replace_once('scripts/build_app.sh', 'BUILD_NUMBER="126"', 'BUILD_NUMBER="127"')

          for name in ['Resources/updates.json', 'Resources/updates.example.json']:
              p = Path(name)
              data = json.loads(p.read_text())
              data['version'] = '0.22.2'
              data['build'] = 127
              data['downloadURL'] = 'https://github.com/PastFly/Selective-Remote/releases/download/v0.22.2/SelectiveRemote-0.22.2-arm64.dmg'
              data['releaseNotesURL'] = 'https://github.com/PastFly/Selective-Remote/releases/tag/v0.22.2'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          ru = '''## 0.22.2

- SFTP Workspace теперь является единственным runtime для SFTP: профильный и глобальный SFTP используют общие реальные панели, а Connection Center открывает, отключает и переподключает конкретную SFTP-панель.
- Исправлен жизненный цикл SFTP: закрытие панели или вкладки отменяет её активные передачи, а общий OpenSSH ControlMaster закрывается только после освобождения последней использующей его панели.
- Отмена зависшего процесса передачи теперь эскалируется с SIGTERM до SIGKILL, если дочерний процесс не завершился штатно.
- Стабилизирован drag-and-drop Mac ↔ Server и Server ↔ Server: используется единая зона drop для панели, а локальные file/folder URL загружаются через NSURL без чтения содержимого файла в drag provider.
- Исправлена компоновка SFTP после завершения передачи: Workspace остаётся закреплён под заголовком окна, а история передач ограничена прокручиваемой областью и больше не сдвигает весь интерфейс.
- Исправлен Focus Mode SFTP: кнопка возврата интерфейса больше не перекрывает «Новая вкладка».
- При удалении профиля теперь удаляется и сохранённый proxy-пароль из Keychain.
- Удалён старый неиспользуемый single-session SFTP runtime и устаревший SFTPBrowserView; Menu Bar управляет очередями актуального SFTP Workspace.
- Release workflow больше не содержит устаревший tag по умолчанию: tag релиза необходимо указывать явно.
- RDP fullscreen, Retina, multi-monitor, topology и hot-plug runtime в этом релизе не изменялись.

'''
          en = '''## 0.22.2

- SFTP Workspace is now the single SFTP runtime: profile and global SFTP use the same real panes, and Connection Center opens, disconnects, and reconnects a specific SFTP pane.
- Fixed SFTP lifecycle handling: closing a pane or tab cancels its active transfers, while a shared OpenSSH ControlMaster is closed only after the last pane using it releases the connection.
- Stuck transfer cancellation now escalates from SIGTERM to SIGKILL when the child process does not terminate normally.
- Stabilized Mac ↔ Server and Server ↔ Server drag and drop with one pane-level drop destination; local file/folder URLs are loaded through NSURL without reading file contents into the drag provider.
- Fixed SFTP layout after transfer completion: the Workspace remains anchored below the window header, and transfer history is bounded in a scrollable area instead of expanding and shifting the whole interface.
- Fixed SFTP Focus Mode so the restore-interface control no longer covers New Tab.
- Deleting a profile now also removes its saved proxy password from Keychain.
- Removed the obsolete single-session SFTP runtime and legacy SFTPBrowserView; Menu Bar transfer controls now operate on the active SFTP Workspace queues.
- The release workflow no longer contains a stale default tag; a release tag must be entered explicitly.
- RDP fullscreen, Retina, multi-monitor, topology, and hot-plug runtime are unchanged in this release.

'''
          for name, prefix in [('CHANGELOG.md', ru), ('CHANGELOG_EN.md', en)]:
              p = Path(name)
              text = p.read_text()
              if not text.startswith('## 0.22.2'):
                  p.write_text(prefix + text)
          PY

          bash -n scripts/build_app.sh
          bash -n scripts/build_and_install.sh
          python3 scripts/release_notes.py 0.22.2 > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          git diff --check

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Leonid"
          git config user.email "82884178+PastFly@users.noreply.github.com"
          git add scripts/build_app.sh Resources/updates.json Resources/updates.example.json CHANGELOG.md CHANGELOG_EN.md
          if git diff --cached --quiet; then
            echo "Release metadata already prepared"
            exit 0
          fi
          git commit -m "Prepare 0.22.2 release"
          git push origin HEAD:agent/sftp-lifecycle-0.22.2
