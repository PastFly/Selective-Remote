name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/v0.25.0-terminal-ux' }}
    name: Swift tests on macOS
    runs-on: macos-14
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.25.0-terminal-ux
          fetch-depth: 0

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Apply single-monitor RDP correction
        run: python3 scripts/v025_rdp_single_monitor_patch.py

      - name: Validate shell scripts
        run: |
          bash -n scripts/build_app.sh
          bash -n scripts/build_and_install.sh
          version="$(sed -nE 's/^VERSION="([^"]+)"/\1/p' scripts/build_app.sh)"
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Test
        run: swift test

      - name: Test terminal web interactions
        run: node --test Tests/TerminalResourcesTests/*.test.js

      - name: Release build
        run: swift build -c release

      - name: Restore normal CI and remove patch drivers
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -- scripts/v025_rdp_single_monitor_patch.py .github/workflows/v025-rdp-single-monitor-round3.yml

      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix single-monitor RDP safe area and restore macOS controls [rdp-round3 applied]"
          git push origin HEAD:feature/v0.25.0-terminal-ux
